<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NumberField — preview</title></head>
<body>
<div id="root" class="dp-stage" style=""></div>
<script>
  var D = window.Drawpane, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 96px)', gap: 8 } },
      h(D.NumberField, { label: 'W', defaultValue: '300' }),
      h(D.NumberField, { label: 'H', defaultValue: '196', unit: 'hug' }),
      h(D.NumberField, { icon: 'layout-row', ariaLabel: 'Gap', token: 'space/200' }),
      h(D.NumberField, { label: '\u00b0', defaultValue: '24*2' }))
  );
</script>
</body>
</html>
