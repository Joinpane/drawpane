<!doctype html>
<html lang="en">
<head>

<title>Workspace — preview</title>
<style>
  html, body { margin: 0; height: 100%; }
  .ws { position: relative; width: 1200px; height: 680px; overflow: hidden; background: var(--canvas); }
  .pane { position: absolute; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-pane); }
  .strip { display: flex; align-items: center; gap: var(--space-100); padding: var(--space-100); }

  .file b { font: 600 13px/18px var(--font-ui); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mark .back { fill: none; stroke: var(--ink); stroke-width: 2.5; }
  .mark .front { fill: var(--signal); }
  .tools { left: 50%; top: 12px; transform: translateX(-50%); }
  .search { display: inline-flex; align-items: center; gap: var(--space-200); height: 28px; width: 220px; padding: 0 var(--space-100) 0 var(--space-200); box-sizing: border-box; border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--ink-muted); font: 400 12px/16px var(--font-ui); }

  .layers { left: 12px; top: 64px; width: 248px; bottom: 12px; padding: var(--space-200) var(--space-100); box-sizing: border-box; }

  .page { display: flex; align-items: center; gap: var(--space-100); height: 28px; padding: 0 var(--space-200); margin-bottom: var(--space-100); border-radius: var(--radius-sm); font: 600 12px/16px var(--font-ui); color: var(--ink); }

  .zoom span { padding: 0 var(--space-100); font-variant-numeric: tabular-nums; }
  /* The design on the canvas is the user's content, so its colors are fixed and do not follow the UI theme. */
  .board-label { position: absolute; left: 430px; top: 70px; font: 500 11px/14px var(--font-ui); color: var(--ink-muted); }
  .board { position: absolute; left: 430px; top: 88px; width: 340px; height: 560px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,.06); overflow: hidden; font-family: var(--font-ui); }
  .d-status { height: 40px; }
  .d-hi { margin: 8px 20px 0; font: 600 22px/28px var(--font-ui); color: #16181d; }
  .d-sub { margin: 2px 20px 0; font: 400 13px/18px var(--font-ui); color: #5b616e; }
  .d-hero { position: absolute; left: 20px; top: 118px; width: 300px; height: 66px; border-radius: 14px; background: #16181d; color: #ffffff; padding: 14px 16px; box-sizing: border-box; font: 600 14px/18px var(--font-ui); }
  .d-hero small { display: block; font: 400 12px/16px var(--font-ui); color: #b9bec8; }
  .d-list { position: absolute; left: 20px; top: 200px; width: 300px; height: 196px; background: #f3f4f6; border-radius: 14px; }
  .d-row { position: absolute; left: 12px; right: 12px; height: 52px; background: #ffffff; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 12px; box-sizing: border-box; font: 500 13px/16px var(--font-ui); color: #16181d; }
  .d-row i { width: 28px; height: 28px; border-radius: 8px; background: #e4e7ec; flex: none; }
  .d-row small { display: block; font: 400 11px/14px var(--font-ui); color: #5b616e; }
  .d-tab { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid #e4e7ec; background: #ffffff; }
  /* Canvas overlays: X-ray, selection, collaborator */
  .xp { position: absolute; background: var(--xray-padding); opacity: .35; }
  .xg { position: absolute; background: var(--xray-gap); opacity: .35; }
  .sel { position: absolute; left: 450px; top: 288px; width: 300px; height: 196px; box-shadow: inset 0 0 0 1.5px var(--signal); }
  .handle { position: absolute; width: 7px; height: 7px; background: #ffffff; box-shadow: inset 0 0 0 1.5px var(--signal); }
  .size { position: absolute; left: 600px; top: 492px; transform: translateX(-50%); padding: 1px 6px; border-radius: var(--radius-xs); background: var(--signal); color: var(--on-signal); font: 500 11px/14px var(--font-mono); }
  .lens { position: absolute; left: 600px; top: 520px; transform: translateX(-50%); }
  .peer { position: absolute; left: 450px; top: 206px; width: 300px; height: 66px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--presence-2); }
  .cursor { position: absolute; left: 700px; top: 238px; }
  .cursor svg path { fill: var(--presence-2); stroke: var(--surface-raised); stroke-width: 1; }
  .tag { position: absolute; left: 14px; top: 16px; padding: 2px 6px; border-radius: var(--radius-xs); background: var(--presence-2); color: var(--on-presence); font: 600 11px/14px var(--font-ui); white-space: nowrap; }
</style>
</head>
