<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root" class="dp-stage" style="gap:14px 4px"></div>
<script>
  var D = window.Drawpane, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null, D.icons.map(function (n) {
      return h('figure', { key: n, style: { margin: 0, width: 84, display: 'grid', justifyItems: 'center', gap: 6, color: 'var(--icon)' } },
        h(D.Icon, { name: n }), h('figcaption', { style: { font: '400 10.5px/14px var(--font-mono)', color: 'var(--ink-muted)', whiteSpace: 'nowrap' } }, n));
    }))
  );
</script>
</body>
</html>
