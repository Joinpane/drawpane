<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .deep { fill: var(--surface-inverse); }
  .brand { fill: var(--signal); }
  .tint { fill: var(--signal-soft); }
  .comp { fill: var(--component); }
  .dot { fill: var(--signal-ink); }
  .pane { rx: var(--radius-lg); }
  .tile { rx: var(--radius-md); }
  .words { position: absolute; left: var(--space-600); bottom: var(--space-600); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 96px; line-height: .92; letter-spacing: -.01em; color: var(--ink); }
  .tag { margin: var(--space-200) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      surface-inverse 168x240 slab bled off the top · signal 192x168 pane in front of it · signal-soft 192x156 bled off top and right · component 96x96 (it only ever marks components) · about 37% of 960x288
  arrangement the logo's composition at scale: an inverse pane behind, a signal pane offset in front, satellites to the right, bottoms on one line space-600 above the edge
  pattern     dot grid, from "a 4px grid, precise, shaped like code" and the canvas dot grid: 30 signal-ink dots at a space-600 pitch on the tint
  scales      sides in space-600 multiples; gutters space-600; dot pitch space-600; corners radius-lg on panes, radius-md on the component tile
-->
<rect class="deep pane" x="24" y="-12" width="168" height="240" rx="12"/>
<rect class="tint pane" x="312" y="-12" width="192" height="156" rx="12"/>
<rect class="brand pane" x="96" y="96" width="192" height="168" rx="12"/>
<rect class="comp tile" x="312" y="168" width="96" height="96" rx="8"/>
<circle class="dot" cx="336" cy="24" r="2"/><circle class="dot" cx="360" cy="24" r="2"/><circle class="dot" cx="384" cy="24" r="2"/><circle class="dot" cx="408" cy="24" r="2"/><circle class="dot" cx="432" cy="24" r="2"/><circle class="dot" cx="456" cy="24" r="2"/>
<circle class="dot" cx="336" cy="48" r="2"/><circle class="dot" cx="360" cy="48" r="2"/><circle class="dot" cx="384" cy="48" r="2"/><circle class="dot" cx="408" cy="48" r="2"/><circle class="dot" cx="432" cy="48" r="2"/><circle class="dot" cx="456" cy="48" r="2"/>
<circle class="dot" cx="336" cy="72" r="2"/><circle class="dot" cx="360" cy="72" r="2"/><circle class="dot" cx="384" cy="72" r="2"/><circle class="dot" cx="408" cy="72" r="2"/><circle class="dot" cx="432" cy="72" r="2"/><circle class="dot" cx="456" cy="72" r="2"/>
<circle class="dot" cx="336" cy="96" r="2"/><circle class="dot" cx="360" cy="96" r="2"/><circle class="dot" cx="384" cy="96" r="2"/><circle class="dot" cx="408" cy="96" r="2"/><circle class="dot" cx="432" cy="96" r="2"/><circle class="dot" cx="456" cy="96" r="2"/>
<circle class="dot" cx="336" cy="120" r="2"/><circle class="dot" cx="360" cy="120" r="2"/><circle class="dot" cx="384" cy="120" r="2"/><circle class="dot" cx="408" cy="120" r="2"/><circle class="dot" cx="432" cy="120" r="2"/><circle class="dot" cx="456" cy="120" r="2"/>
</svg>
</div>
<div class="words">
<h1 class="name">Drawpane</h1>
<p class="tag">The design tool you own.</p>
</div>
</div>
</body>
</html>
