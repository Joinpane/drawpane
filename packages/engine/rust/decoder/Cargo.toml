[package]
name = "drawpane-image-decoder"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
wasm = []

[dependencies]
gif = { version = "0.14", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
jpeg-decoder = { path = "../vendor/jpeg-decoder", default-features = false }
png = "0.18"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
jpeg-decoder-reference = { package = "jpeg-decoder", version = "=0.3.2", default-features = false }
