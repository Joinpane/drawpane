[workspace]
members = ["decoder"]
exclude = ["vendor/jpeg-decoder", "vendor/vello_shaders"]
resolver = "3"

[package]
name = "drawpane-engine"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Drawpane's render engine (decision 0040): a retained render graph drawn by Vello on the GPU (WebGPU) in the browser and on the CPU in Workers."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Shared GPU code (vello_gpu on wgpu): pick `gpu` (WebGPU) or `webgl` (WebGL2).
gpu-common = [
  "dep:vello_gpu",
  "dep:wgpu",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:futures-channel",
]
# The primary browser build, shared by the editor and browser CPU workers.
gpu = ["gpu-common", "wgpu/webgpu"]
# Alternate WebGPU build for the opt-in compute diagnostics.
compute = ["gpu", "dep:vello_encoding", "dep:vello_shaders", "dep:bytemuck"]
# The WebGL2 fallback build: vello_gpu on wgpu's GL backend (naga -> GLSL ES 3.0). Built as a
# separate module that loads only after the WebGPU probe fails (decision 0040).
webgl = ["gpu-common", "wgpu/webgl"]
# Reference backdrop readers used only by the tests (render graph invalidation); see
# src/kernels.rs. Never in a shipped build.
test-kernels = []

[dependencies]
vello_common = { version = "=0.4.0", default-features = false, features = ["std"] }
vello_cpu = { version = "=0.4.0", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline"] }
vello_gpu = { version = "=0.4.0", default-features = false, features = ["wgpu", "full_image_support", "gradient_sweep", "blurred_rounded_rect"], optional = true }
vello_encoding = { version = "=0.12.0", optional = true }
vello_shaders = { path = "vendor/vello_shaders", default-features = false, features = ["wgsl"], optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl"], optional = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = "0.3"
futures-channel = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "ImageBitmap", "OffscreenCanvas", "console", "Window", "Performance"] }

[dev-dependencies]
drawpane-engine = { path = ".", features = ["test-kernels"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# The fuzz and property tests render thousands of frames: keep them fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1

# vello_gpu with Drawpane's patch (uploads through the queue on the web): see
# vendor/vello_gpu/VENDORED.md.
[patch.crates-io]
vello_gpu = { path = "vendor/vello_gpu" }
