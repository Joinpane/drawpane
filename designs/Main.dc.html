<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane editor, design mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <dc-import name="PartTopBar" tool="pointer" hint-size="100%,40px"></dc-import>
  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 12px">
    <dc-import name="PartLayers" selected="upcoming" hint-size="248px,824px"></dc-import>

    <main aria-label="Canvas" style="flex: 999 1 560px; min-width: 0; position: relative; height: 824px">
      <div style="position: absolute; left: 50%; top: 40px; width: 340px; height: 560px; margin-left: -170px">
        <span style="position: absolute; left: 0; top: -20px; font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-muted)">Home — iOS</span>
        <dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import>

        <div aria-hidden="true" style="position: absolute; left: 20px; top: 118px; width: 300px; height: 66px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--presence-2)"></div>
        <div aria-hidden="true" style="position: absolute; left: 262px; top: 150px">
          <svg width="16" height="18" viewBox="0 0 16 18"><path d="M1 1l13 6.5-5.6 1.6L6.2 15z" fill="var(--presence-2)" stroke="var(--surface-raised)" stroke-width="1"></path></svg>
          <span style="position: absolute; left: 14px; top: 16px; padding: 2px 6px; border-radius: var(--radius-xs); background: var(--presence-2); color: var(--on-presence); font-size: 11px; line-height: 14px; font-weight: 600; white-space: nowrap">Lena</span>
        </div>

        <div aria-hidden="true" style="position: absolute; left: 20px; top: 200px; width: 300px; height: 196px; box-shadow: inset 0 0 0 1.5px var(--signal)"></div>
        <span aria-hidden="true" style="position: absolute; left: 16.5px; top: 196.5px; width: 7px; height: 7px; background: #ffffff; box-shadow: inset 0 0 0 1.5px var(--signal)"></span>
        <span aria-hidden="true" style="position: absolute; left: 316.5px; top: 196.5px; width: 7px; height: 7px; background: #ffffff; box-shadow: inset 0 0 0 1.5px var(--signal)"></span>
        <span aria-hidden="true" style="position: absolute; left: 16.5px; top: 392.5px; width: 7px; height: 7px; background: #ffffff; box-shadow: inset 0 0 0 1.5px var(--signal)"></span>
        <span aria-hidden="true" style="position: absolute; left: 316.5px; top: 392.5px; width: 7px; height: 7px; background: #ffffff; box-shadow: inset 0 0 0 1.5px var(--signal)"></span>
        <span style="position: absolute; left: 170px; top: 404px; transform: translateX(-50%); padding: 1px 6px; border-radius: var(--radius-xs); background: var(--signal); color: var(--on-signal); font-family: var(--font-mono); font-size: 11px; line-height: 14px; font-weight: 500; white-space: nowrap">300 × 196</span>

        <div style="position: absolute; left: 170px; top: 432px; transform: translateX(-50%); white-space: nowrap">
          <x-import component-from-global-scope="Drawpane.SelectionLens" kind="Frame · Auto layout" kind-icon="board">
            <x-import component-from-global-scope="Drawpane.NumberField" label="W" default-value="300"></x-import>
            <x-import component-from-global-scope="Drawpane.NumberField" label="H" default-value="196" unit="hug"></x-import>
            <x-import component-from-global-scope="Drawpane.NumberField" icon="layout-col" aria-label="Gap" token="space/200"></x-import>
            <x-import component-from-global-scope="Drawpane.NumberField" label="▢" aria-label="Padding" default-value="12"></x-import>
          </x-import>
        </div>
      </div>

      <div style="position: absolute; left: 0; bottom: 0; width: 168px; padding: 8px; box-sizing: border-box; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-pane)">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px">
          <span style="font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-muted)">Mobile v2 · 3 boards</span>
        </div>
        <div aria-label="Minimap" style="position: relative; height: 72px; border-radius: var(--radius-xs); background: var(--canvas)">
          <span style="position: absolute; left: 14px; top: 12px; width: 26px; height: 46px; background: var(--surface-raised); box-shadow: 0 0 0 1px var(--line-strong)"></span>
          <span style="position: absolute; left: 62px; top: 12px; width: 26px; height: 46px; background: var(--surface-raised); box-shadow: 0 0 0 1px var(--line-strong)"></span>
          <span style="position: absolute; left: 110px; top: 12px; width: 26px; height: 46px; background: var(--surface-raised); box-shadow: 0 0 0 1px var(--line-strong); opacity: .5"></span>
          <span style="position: absolute; left: 4px; top: 6px; width: 46px; height: 60px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--signal)"></span>
          <span style="position: absolute; left: 32px; top: 26px; width: 5px; height: 5px; border-radius: 50%; background: var(--presence-2)"></span>
        </div>
      </div>

      <div style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-pane)">
        <x-import component-from-global-scope="Drawpane.IconButton" icon="minus" label="Zoom out" shortcut="-"></x-import>
        <span style="padding: 0 4px; font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-muted); font-variant-numeric: tabular-nums">100%</span>
        <x-import component-from-global-scope="Drawpane.IconButton" icon="plus" label="Zoom in" shortcut="+"></x-import>
        <span style="width: 1px; height: 16px; margin: 0 2px; background: var(--line-strong)"></span>
        <x-import component-from-global-scope="Drawpane.IconButton" icon="xray" label="Layout X-ray" shortcut="Hold Alt"></x-import>
        <x-import component-from-global-scope="Drawpane.IconButton" icon="comment" label="Comments" shortcut="C"></x-import>
      </div>

      <div style="position: absolute; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-pane); font-size: 11px; line-height: 14px; color: var(--ink-muted)">
        <span style="display: inline-flex; color: var(--success)"><x-import component-from-global-scope="Drawpane.Icon" name="check" size="12"></x-import></span>
        <span>Saved · revision 1,204</span>
      </div>
    </main>

    <dc-import name="PartInspector" hint-size="264px,824px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
