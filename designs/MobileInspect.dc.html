<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane phone, inspect</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-ui)">
  <header style="display: flex; align-items: center; gap: 4px; height: 56px; margin-top: 44px; padding: 0 4px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <span style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--icon)"><x-import component-from-global-scope="Drawpane.Icon" name="chevron-down"></x-import></span>
    <span style="flex: 1; display: grid"><span style="font-size: 15px; line-height: 20px; font-weight: 600">Home</span><span style="font-size: 12px; line-height: 16px; color: var(--ink-muted)">Mobile app · tap a layer to inspect</span></span>
    <span style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--icon)"><x-import component-from-global-scope="Drawpane.Icon" name="more"></x-import></span>
  </header>
  <div style="position: relative; height: 330px; overflow: hidden">
    <div style="position: absolute; left: 25px; top: 16px; transform: scale(.86); transform-origin: top left"><dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import></div>
    <span aria-hidden="true" style="position: absolute; left: 42px; top: 117px; width: 258px; height: 57px; border-radius: 12px; box-shadow: 0 0 0 2px var(--signal)"></span>
    <span style="position: absolute; left: 140px; top: 180px; padding: 2px 6px; border-radius: 4px; background: var(--signal); color: var(--on-signal); font-size: 11px; font-family: var(--font-mono)">300 × 66</span>
    <span aria-hidden="true" style="position: absolute; left: 25px; top: 145px; width: 17px; height: 1px; background: var(--guide)"></span>
    <span style="position: absolute; left: 22px; top: 150px; padding: 0 3px; border-radius: 3px; background: var(--guide); color: #ffffff; font-size: 10px; font-family: var(--font-mono)">20</span>
  </div>
  <section aria-label="Inspect sheet" style="flex: 1; min-height: 0; margin-top: -8px; border-radius: 16px 16px 0 0; background: var(--surface); box-shadow: 0 -4px 16px rgba(0,0,0,.08); padding: 8px 16px 0; display: grid; gap: 12px; align-content: start; overflow: hidden">
    <span style="justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong)"></span>
    <div style="display: flex; align-items: center; gap: 8px"><strong style="flex: 1; display: flex; align-items: center; gap: 6px; font-size: 16px; color: var(--component-ink)"><x-import component-from-global-scope="Drawpane.Icon" name="instance"></x-import>Hero card</strong><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Code" value="swift" options="{{langs}}"></x-import></div>
    <dl style="margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; font-size: 14px; line-height: 19px">
      <sc-for list="{{props}}" as="p" hint-placeholder-count="6"><dt style="color: var(--ink-muted)">{{p.k}}</dt><dd style="margin: 0; display: flex; align-items: center; gap: 6px"><span style="{{p.sw}}"></span><span style="{{p.vs}}">{{p.v}}</span></dd></sc-for>
    </dl>
    <pre style="margin: 0; padding: 12px; border-radius: var(--radius-md); background: var(--surface-sunken); font-family: var(--font-mono); font-size: 12px; line-height: 18px; white-space: pre-wrap">HeroCard(style: .dark,
  title: "Design review at 2:00")
  .padding(.space250)</pre>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 24px"><span style="height: 44px; border-radius: var(--radius-md); background: var(--surface-sunken); display: grid; place-items: center; font-size: 15px; font-weight: 600">Copy code</span><span style="height: 44px; border-radius: var(--radius-md); background: var(--surface-inverse); color: var(--ink-inverse); display: grid; place-items: center; font-size: 15px; font-weight: 600">Export assets</span></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var plain = 'font-family: var(--font-mono); font-size: 13px';
    var tok = 'height: 22px; padding: 0 8px; border-radius: var(--radius-xs); background: var(--surface-sunken); font-size: 13px; line-height: 22px';
    var sw = function (c) { return c ? 'width: 14px; height: 14px; border-radius: 4px; background: ' + c + '; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1)' : 'display: none'; };
    return {
      theme: T,
      langs: [{ value: 'swift', label: 'Swift' }, { value: 'css', label: 'CSS' }],
      props: [
        { k: 'Size', v: '300 × 66', vs: plain, sw: sw('') },
        { k: 'Padding', v: 'space/250 · 20', vs: tok, sw: sw('') },
        { k: 'Radius', v: 'radius/lg · 14', vs: tok, sw: sw('') },
        { k: 'Fill', v: 'brand/500', vs: tok, sw: sw('#2b4fd6') },
        { k: 'Title', v: 'type/title-lg', vs: tok, sw: sw('') },
        { k: 'Variant', v: 'Style = Dark', vs: plain, sw: sw('') }
      ]
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
