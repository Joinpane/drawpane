<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane font picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-editor" style="position: relative">
  <dc-import name="PartTopBar" tool="text" file="Marketing site" hint-size="100%,40px"></dc-import>
  <div class="u-work">
    <dc-import name="PartLayers" selected="greeting" hint-size="248px,824px"></dc-import>
    <main class="u-stage" aria-label="Canvas">
      <div class="u-board" style="left: 30px; top: 40px; width: 560px; height: 300px; padding: 40px; box-sizing: border-box">
        <div style="font-size: 34px; line-height: 42px; font-weight: 600; letter-spacing: -0.01em; font-family: Georgia, serif">Plan your week in one glance</div>
        <span class="u-outline" style="left: 36px; top: 36px; width: 488px; height: 96px"></span>
        <span class="u-label u-label--signal" style="left: 36px; top: 138px">Previewing Fraunces · press ↵ to keep</span>
      </div>
    </main>
    <dc-import name="PartInspector" hint-size="264px,824px"></dc-import>
  </div>
  <section role="dialog" aria-label="Choose a font" class="u-modal" style="position: absolute; right: 288px; top: 120px; width: 360px">
    <div style="padding: 10px"><div class="u-input u-input--focus"><x-import component-from-global-scope="Drawpane.Icon" name="search" size="12"></x-import><span class="u-grow">fra</span><span class="u-xs u-muted">↑↓ to preview</span></div></div>
    <div class="u-row" style="padding: 0 10px 8px; gap: 4px"><sc-for list="{{src}}" as="s" hint-placeholder-count="4"><span class="u-pill {{s.on}}" style="height: 24px; padding: 0 9px">{{s.t}}</span></sc-for></div>
    <div class="u-list" style="padding: 0 6px 6px">
      <sc-for list="{{fonts}}" as="f" hint-placeholder-count="7">
        <div class="u-item {{f.sel}}"><span class="u-grow u-col" style="gap: 0; min-width: 0"><span style="{{f.st}}">{{f.n}}</span><span class="u-xs u-muted">{{f.m}}</span></span><span class="{{f.cc}}">{{f.c}}</span></div>
      </sc-for>
    </div>
    <div class="u-row u-xs u-muted" style="padding: 8px 12px; border-top: 1px solid var(--line)"><span class="u-grow">Team fonts are uploaded once and served from your R2</span><span>Manage</span></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var F = [['Fraunces', 'Georgia, serif', 'Google · 9 weights · variable', 'Google', 1], ['Frank Ruhl Libre', 'Georgia, serif', 'Google · 5 weights', 'Google', 0], ['Francois One', 'Impact, sans-serif', 'Google · 1 weight', 'Google', 0], ['Acme Frame Sans', 'var(--font-ui)', 'Team font · uploaded by Lena', 'Team', 0], ['Franklin Gothic', 'Arial Narrow, sans-serif', 'On this computer · not shared', 'Local', 0], ['Frutiger', 'var(--font-ui)', 'Used in this file · missing', 'Missing', 0]];
    return {
      src: [{ t: 'All', on: 'is-on' }, { t: 'In this file', on: '' }, { t: 'Team', on: '' }, { t: 'Google', on: '' }],
      fonts: F.map(function (f) { return { n: f[0], m: f[2], st: 'font-family: ' + f[1] + '; font-size: 18px; line-height: 24px', c: f[3], cc: f[3] === 'Missing' ? 'u-chip u-chip--signal' : f[3] === 'Team' ? 'u-chip u-chip--comp' : 'u-chip u-chip--muted', sel: H.sel(f[4]) }; })
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
