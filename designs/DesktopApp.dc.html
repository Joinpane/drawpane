<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane desktop app window</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: 940px; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <div class="u-row" style="height: 38px; padding: 0 12px; gap: 6px; background: var(--surface-sunken); border-bottom: 1px solid var(--line)">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
    <span style="width: 14px"></span>
    <span class="u-row u-sm" style="height: 28px; padding: 0 10px; border-radius: 6px; color: var(--ink-muted)"><x-import component-from-global-scope="Drawpane.Icon" name="layers" size="12"></x-import>Files</span>
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><span style="{{t.s}}"><span style="{{t.dot}}"></span>{{t.n}}<span class="u-xs u-muted">×</span></span></sc-for>
    <x-import component-from-global-scope="Drawpane.IconButton" icon="plus" label="New tab"></x-import>
    <span class="u-spacer"></span>
    <span class="u-chip u-chip--signal">Offline · 12 changes saved here</span>
    <span class="u-xs u-muted">design.acme.com</span>
  </div>
  <div class="u-editor" style="flex: none; height: 902px">
    <dc-import name="PartTopBar" hint-size="100%,40px"></dc-import>
    <div class="u-work">
      <dc-import name="PartLayers" selected="upcoming" hint-size="248px,824px"></dc-import>
      <main class="u-stage" style="height: auto"><div style="position: absolute; left: calc(50% - 170px); top: 40px; width: 340px; height: 560px"><dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import></div>
        <div class="u-pop u-col" style="position: absolute; right: 12px; top: 12px; width: 280px; padding: 12px"><strong class="u-sm">Desktop app extras</strong><sc-for list="{{extras}}" as="e" hint-placeholder-count="5"><div class="u-row u-sm"><span class="u-ico u-ico--ok u-ico--sm"><x-import component-from-global-scope="Drawpane.Icon" name="check" size="12"></x-import></span><span class="u-grow">{{e}}</span></div></sc-for></div>
      </main>
      <dc-import name="PartInspector" hint-size="264px,824px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 940}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var tab = function (n, on, dot) { return { n: n, s: 'display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12px; ' + (on ? 'background: var(--surface); box-shadow: var(--shadow-pane); font-weight: 600' : 'color: var(--ink-muted)'), dot: 'width: 6px; height: 6px; border-radius: 50%; background: ' + (dot || 'transparent') }; };
    return {
      tabs: [tab('Mobile app', 1, 'var(--signal)'), tab('Acme design system', 0), tab('Checkout flow', 0, 'var(--agent)'), tab('Web dashboard', 0)],
      extras: ['Works fully offline, syncs on reconnect', 'Local fonts without uploading', 'Tabs for files, drag to split', 'System notifications for agents and mentions', 'Opens drawpane:// links']
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
