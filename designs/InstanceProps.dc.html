<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane instance properties and swap</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <dc-import name="PartTopBar" hint-size="100%,40px"></dc-import>
  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 12px">
    <dc-import name="PartLayers" selected="hero" hint-size="248px,824px"></dc-import>

    <main aria-label="Canvas" style="flex: 999 1 560px; min-width: 0; height: 824px; position: relative">
      <div style="position: absolute; left: calc(50% - 260px); top: 40px; width: 340px; height: 560px">
        <dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import>
        <span aria-hidden="true" style="position: absolute; left: 20px; top: 118px; width: 300px; height: 66px; border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--component)"></span>
        <span style="position: absolute; left: 20px; top: 98px; display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px 1px 4px; border-radius: var(--radius-xs); background: var(--component); color: #ffffff; font-size: 11px; line-height: 14px; font-weight: 600"><x-import component-from-global-scope="Drawpane.Icon" name="instance" size="12"></x-import>Hero card</span>
      </div>

      <div role="dialog" aria-label="Swap instance" style="position: absolute; left: calc(50% + 100px); top: 120px; width: 300px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-bottom: 1px solid var(--line); color: var(--icon)">
          <x-import component-from-global-scope="Drawpane.Icon" name="search"></x-import>
          <span style="flex: 1; font-size: 13px; color: var(--ink-muted)">Swap Hero card with…</span>
          <x-import component-from-global-scope="Drawpane.SegmentedControl" label="Scope" value="similar" options="{{scope}}"></x-import>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px">
          <sc-for list="{{swaps}}" as="s" hint-placeholder-count="4">
            <button type="button" style="{{s.card}}">
              <span style="display: grid; place-items: center; height: 56px; border-radius: 6px; background: #f3f4f6"><span style="{{s.shape}}"></span></span>
              <span style="font-size: 12px; line-height: 16px; font-weight: 600">{{s.name}}</span>
              <span style="font-size: 11px; line-height: 14px; color: var(--ink-muted)">{{s.meta}}</span>
            </button>
          </sc-for>
        </div>
        <div style="padding: 8px 10px; border-top: 1px solid var(--line); font-size: 11px; line-height: 14px; color: var(--ink-muted)">Overrides carry over when layer names match.</div>
      </div>
    </main>

    <aside aria-label="Inspector for an instance" style="width: 264px; height: 824px; box-sizing: border-box; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); overflow: hidden">
      <div style="padding: 8px 12px 4px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Right pane" value="design" options="{{modes}}"></x-import></div>
      <section class="dp-section" aria-label="Instance">
        <div class="dp-section__head">
          <h3 class="dp-section__title" style="display: flex; align-items: center; gap: 6px; color: var(--component-ink)"><x-import component-from-global-scope="Drawpane.Icon" name="instance" size="12"></x-import>Hero card</h3>
          <div class="dp-section__actions"><x-import component-from-global-scope="Drawpane.IconButton" icon="component" label="Go to main component"></x-import><x-import component-from-global-scope="Drawpane.IconButton" icon="more" label="Instance options"></x-import></div>
        </div>
        <div class="dp-section__body">
          <span class="dp-caption">Acme design system 2.4.0 · up to date</span>
          <div class="dp-row dp-row--label"><span class="dp-caption">Style</span><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Style" value="dark" options="{{styles}}"></x-import></div>
          <div class="dp-row dp-row--label"><span class="dp-caption">Subtitle</span><x-import component-from-global-scope="Drawpane.Switch" checked="{{yes}}" label="Show"></x-import></div>
          <div class="dp-row dp-row--label"><span class="dp-caption">Icon</span><span style="display: flex; align-items: center; justify-content: space-between; height: 24px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--surface-sunken); font-size: 12px">Calendar <x-import component-from-global-scope="Drawpane.Icon" name="chevron-down" size="12"></x-import></span></div>
          <div class="dp-row dp-row--label"><span class="dp-caption">Title</span><x-import component-from-global-scope="Drawpane.NumberField" label="T" aria-label="Title text" default-value="Design review at 2:00"></x-import></div>
        </div>
      </section>
      <section class="dp-section" aria-label="Overrides">
        <div class="dp-section__head"><h3 class="dp-section__title">Overrides · 2</h3><x-import component-from-global-scope="Drawpane.Button" size="sm" variant="ghost">Reset all</x-import></div>
        <div class="dp-section__body" style="gap: 4px">
          <sc-for list="{{overrides}}" as="o" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 0 8px; border-radius: var(--radius-sm); background: var(--surface-sunken); font-size: 12px">
              <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--component)"></span>
              <span style="flex: 1">{{o}}</span>
              <x-import component-from-global-scope="Drawpane.IconButton" icon="history" label="Reset this override"></x-import>
            </div>
          </sc-for>
        </div>
      </section>
      <section class="dp-section" aria-label="Instance actions">
        <div class="dp-section__body" style="grid-template-columns: 1fr 1fr">
          <x-import component-from-global-scope="Drawpane.Button" size="sm">Swap…</x-import>
          <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="ghost">Detach</x-import>
          <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="ghost">Push changes to main</x-import>
          <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="ghost">Select all 14</x-import>
        </div>
      </section>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var card = 'display: grid; gap: 4px; padding: 6px; border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--ink); text-align: left; cursor: pointer; border: 1px solid ';
    return {
      theme: this.props.theme ?? 'light',
      yes: true,
      modes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }],
      styles: [{ value: 'dark', label: 'Dark' }, { value: 'brand', label: 'Brand' }, { value: 'quiet', label: 'Quiet' }],
      scope: [{ value: 'similar', label: 'Similar' }, { value: 'all', label: 'All' }],
      overrides: ['Title text', 'Subtitle text'],
      swaps: [
        { name: 'Hero card', meta: 'Brand', card: card + 'var(--line-strong)', shape: 'width: 80%; height: 20px; border-radius: 6px; background: #2b4fd6' },
        { name: 'Hero card', meta: 'Quiet', card: card + 'var(--line-strong)', shape: 'width: 80%; height: 20px; border-radius: 6px; background: #ffffff; box-shadow: 0 0 0 1px #e4e7ec' },
        { name: 'Promo card', meta: 'Same size', card: card + 'var(--line-strong)', shape: 'width: 80%; height: 24px; border-radius: 6px; background: #ffd8c7' },
        { name: 'Notice', meta: '2 overrides lost', card: card + 'var(--line-strong)', shape: 'width: 80%; height: 14px; border-radius: 4px; background: #fdf6e3' }
      ]
    };
  }
}
</script>
</body>
</html>
