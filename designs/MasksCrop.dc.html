<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane masks and image crop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-editor">
  <dc-import name="PartTopBar" hint-size="100%,40px"></dc-import>
  <div class="u-work">
    <dc-import name="PartLayers" selected="hero" hint-size="248px,824px"></dc-import>
    <main class="u-stage" aria-label="Crop and masks">
      <figure class="u-fig" style="position: absolute; left: 20px; top: 20px; width: 380px">
        <figcaption class="u-cap">Cropping an image fill · double-click</figcaption>
        <div style="position: relative; height: 380px; border-radius: var(--radius-md); background: var(--canvas)">
          <div style="position: absolute; left: 20px; top: 30px; width: 340px; height: 300px; background: linear-gradient(160deg, #cfd8e3, #9fb3c8 50%, #6f7f94); opacity: .35"></div>
          <div style="position: absolute; left: 70px; top: 90px; width: 220px; height: 160px; background: linear-gradient(160deg, #cfd8e3, #9fb3c8 50%, #6f7f94); background-size: 340px 300px; background-position: -50px -60px; box-shadow: 0 0 0 1.5px var(--signal)"></div>
          <div style="position: absolute; left: 70px; top: 90px; width: 220px; height: 160px; background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px); background-size: 73.3px 53.3px"></div>
          <sc-for list="{{crop}}" as="c" hint-placeholder-count="8"><span style="{{c}}"></span></sc-for>
          <span class="u-label u-label--signal" style="left: 130px; top: 260px">220 × 160 of 2400 × 1600</span>
          <div class="u-pop u-row" style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 4px; white-space: nowrap"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Aspect" value="free" options="{{aspect}}"></x-import><x-import component-from-global-scope="Drawpane.Button" size="sm" variant="primary">Done</x-import></div>
        </div>
      </figure>
      <figure class="u-fig" style="position: absolute; left: 420px; top: 20px; width: 340px">
        <figcaption class="u-cap">Masks · the shape below clips everything above it</figcaption>
        <div style="position: relative; height: 380px; border-radius: var(--radius-md); background: var(--canvas)">
          <div style="position: absolute; left: 70px; top: 50px; width: 200px; height: 200px; border-radius: 50%; overflow: hidden; background: linear-gradient(160deg, #ffd8c7, #e04f1a)"><span style="position: absolute; left: 30px; top: 40px; width: 160px; height: 90px; border-radius: 12px; background: #16181d; opacity: .85"></span></div>
          <span style="position: absolute; left: 70px; top: 50px; width: 200px; height: 200px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--signal)"></span>
          <span style="position: absolute; left: 100px; top: 90px; width: 160px; height: 90px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--signal); opacity: .6; outline: 1px dashed var(--signal)"></span>
          <div class="u-col u-col--tight" style="position: absolute; left: 20px; right: 20px; bottom: 16px">
            <div class="u-row u-sm"><x-import component-from-global-scope="Drawpane.Icon" name="group" size="12"></x-import><span>Avatar group</span></div>
            <div class="u-row u-sm" style="padding-left: 16px"><x-import component-from-global-scope="Drawpane.Icon" name="rectangle" size="12"></x-import><span>Card</span><span class="u-xs u-muted">clipped</span></div>
            <div class="u-row u-sm" style="padding-left: 16px"><x-import component-from-global-scope="Drawpane.Icon" name="ellipse" size="12"></x-import><span class="u-b">Circle mask</span><span class="u-chip u-chip--muted">mask</span></div>
          </div>
        </div>
      </figure>
      <section class="u-pop u-col" style="position: absolute; left: 20px; top: 460px; width: 740px; padding: 12px 14px">
        <strong class="u-md">Three ways to hide what's outside</strong>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px">
          <sc-for list="{{ways}}" as="w" hint-placeholder-count="3"><div class="u-col u-col--tight"><span class="u-row u-sm u-b"><x-import component-from-global-scope="Drawpane.Icon" name="{{w.i}}" size="12"></x-import>{{w.t}}</span><span class="u-xs u-muted">{{w.d}}</span><span class="u-kbd" style="justify-self: start">{{w.k}}</span></div></sc-for>
        </div>
      </section>
    </main>
    <dc-import name="PartInspector" hint-size="264px,824px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var x0 = 70, y0 = 90, w = 220, h = 160;
    var cr = function (x, y, horiz) { return 'position: absolute; left: ' + (x - (horiz ? 10 : 2)) + 'px; top: ' + (y - (horiz ? 2 : 10)) + 'px; width: ' + (horiz ? 20 : 4) + 'px; height: ' + (horiz ? 4 : 20) + 'px; border-radius: 2px; background: #ffffff; box-shadow: 0 0 0 1px var(--signal)'; };
    return {
      crop: [cr(x0, y0, 1), cr(x0, y0, 0), cr(x0 + w, y0, 1), cr(x0 + w, y0, 0), cr(x0, y0 + h, 1), cr(x0, y0 + h, 0), cr(x0 + w, y0 + h, 1), cr(x0 + w, y0 + h, 0)],
      aspect: H.opts(['Free', '1:1', '4:3', '16:9']),
      ways: [{ i: 'image', t: 'Crop an image', d: 'Keeps the whole image; you can re-crop later.', k: '↵ or double-click' }, { i: 'ellipse', t: 'Use as mask', d: 'Any shape clips the layers above it in the group.', k: '⌃ ⌘ M' }, { i: 'board', t: 'Clip content', d: 'Boards and auto layout frames hide overflow.', k: 'Inspector · Clip' }]
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
