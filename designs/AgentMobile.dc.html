<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane phone, agent run</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-phone">
  <header class="u-row" style="height: 56px; margin-top: 44px; padding: 0 8px; border-bottom: 1px solid var(--line)">
    <span style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--icon); transform: rotate(90deg)"><x-import component-from-global-scope="Drawpane.Icon" name="chevron-down"></x-import></span>
    <span class="u-grow u-col" style="gap: 0"><span class="u-lg u-b">Empty states agent</span><span class="u-sm u-muted">Mobile app · for you</span></span>
  </header>
  <div class="u-col u-col--loose" style="flex: 1; min-height: 0; padding: 16px; overflow: hidden">
    <div class="u-row"><x-import component-from-global-scope="Drawpane.AgentTag" name="Empty states agent" status="waiting" hide-status="{{H.yes}}"></x-import><span class="u-md u-muted">Paused · needs you</span></div>
    <div style="position: relative; height: 220px; border-radius: var(--radius-md); background: var(--canvas); overflow: hidden">
      <div style="position: absolute; left: 50%; top: -96px; width: 340px; height: 560px; margin-left: -170px; transform: scale(.8); transform-origin: top center"><dc-import name="PartBoard" variant="empty" hint-size="340px,560px"></dc-import></div>
    </div>
    <div class="u-pane" style="box-shadow: inset 0 0 0 1.5px var(--agent); background: var(--surface-raised)">
      <div class="u-col" style="padding: 14px">
        <strong class="u-lg">Illustrations or icons for empty lists?</strong>
        <div class="u-row"><span class="u-btnlg u-grow">Illustration</span><span class="u-btnlg u-btnlg--primary u-grow">Icon</span></div>
        <span class="u-btnlg" style="background: transparent; box-shadow: inset 0 0 0 1px var(--line)">You decide</span>
      </div>
    </div>
    <div role="list" style="display: grid; gap: 2px">
      <x-import component-from-global-scope="Drawpane.AgentStep" status="done" label="Inserted EmptyState in Upcoming"></x-import>
      <x-import component-from-global-scope="Drawpane.AgentStep" status="review" label="Waiting for your answer"></x-import>
      <x-import component-from-global-scope="Drawpane.AgentStep" status="queued" label="Error state with retry"></x-import>
    </div>
    <span class="u-sm u-muted">When it's done you can review the before and after here and merge with one tap.</span>
  </div>
  <nav aria-label="App" style="display: grid; grid-template-columns: repeat(4, 1fr); height: 64px; padding-bottom: 18px; border-top: 1px solid var(--line); background: var(--surface)">
    <a href="#" style="position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--ink-muted); text-decoration: none; font-size: 11px; font-weight: 400"><x-import component-from-global-scope="Drawpane.Icon" name="layers"></x-import>Files</a>
    <a href="#" style="position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--ink-muted); text-decoration: none; font-size: 11px; font-weight: 400"><span style="position: absolute; top: 8px; margin-left: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--signal)"></span><x-import component-from-global-scope="Drawpane.Icon" name="comment"></x-import>Inbox</a>
    <a href="#" style="position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--ink); text-decoration: none; font-size: 11px; font-weight: 600"><x-import component-from-global-scope="Drawpane.Icon" name="agent"></x-import>Agents</a>
    <a href="#" style="position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--ink-muted); text-decoration: none; font-size: 11px; font-weight: 400"><x-import component-from-global-scope="Drawpane.Icon" name="eye"></x-import>Viewer</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    return {};
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
