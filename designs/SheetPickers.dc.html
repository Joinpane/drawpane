<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane color, gradient, image and effect pickers</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 900px; box-sizing: border-box; padding: 32px; background: var(--canvas); color: var(--ink); font-family: var(--font-ui)">
  <header style="display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 24px">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Fill pickers</h1>
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted)">One popover, four tabs. Tokens come first, raw values second, so the design system stays the easy path.</p>
  </header>
  <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

    <figure style="margin: 0; display: grid; gap: 8px; width: 316px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted)">Solid color</figcaption>
      <div role="dialog" aria-label="Solid fill" style="border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Fill type" value="solid" options="{{types}}"></x-import><span style="flex: 1"></span><x-import component-from-global-scope="Drawpane.IconButton" icon="close" label="Close"></x-import></div>
        <div style="position: relative; height: 180px; margin: 0 8px; border-radius: 6px; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(226 70% 50%))">
          <span style="position: absolute; left: 78%; top: 18%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px rgba(0,0,0,.3)"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 8px">
          <x-import component-from-global-scope="Drawpane.IconButton" icon="pen" label="Pick a color from screen"></x-import>
          <div style="flex: 1; display: grid; gap: 8px">
            <span style="height: 10px; border-radius: 5px; background: linear-gradient(to right, red, yellow, lime, cyan, blue, magenta, red); position: relative"><span style="position: absolute; left: 62%; top: -2px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #2b4fd6; box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px rgba(0,0,0,.25)"></span></span>
            <span style="height: 10px; border-radius: 5px; background: linear-gradient(to right, transparent, #2b4fd6), repeating-conic-gradient(#d9dce1 0 25%, #ffffff 0 50%) 0 0 / 8px 8px; position: relative"><span style="position: absolute; left: 100%; top: -2px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #2b4fd6; box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px rgba(0,0,0,.25)"></span></span>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 64px 1fr 60px; gap: 6px; padding: 0 8px 10px">
          <span style="display: flex; align-items: center; justify-content: space-between; height: 24px; padding: 0 6px; border-radius: var(--radius-sm); background: var(--surface-sunken); font-size: 11px">Hex <x-import component-from-global-scope="Drawpane.Icon" name="chevron-down" size="12"></x-import></span>
          <x-import component-from-global-scope="Drawpane.NumberField" label="#" aria-label="Hex value" default-value="2B4FD6"></x-import>
          <x-import component-from-global-scope="Drawpane.NumberField" label="%" aria-label="Opacity" default-value="100"></x-import>
        </div>
        <div style="border-top: 1px solid var(--line); padding: 10px 8px; display: grid; gap: 8px">
          <div style="display: flex; align-items: center; justify-content: space-between"><span class="dp-caption">Tokens · Acme design system</span><x-import component-from-global-scope="Drawpane.IconButton" icon="search" label="Search tokens"></x-import></div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{tokens}}" as="t" hint-placeholder-count="6"><x-import component-from-global-scope="Drawpane.TokenChip" name="{{t.n}}" swatch="{{t.c}}"></x-import></sc-for>
          </div>
          <span class="dp-caption">In this file</span>
          <div style="display: flex; gap: 6px"><sc-for list="{{doc}}" as="d" hint-placeholder-count="8"><span style="{{d}}"></span></sc-for></div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px; width: 316px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted)">Gradient</figcaption>
      <div role="dialog" aria-label="Gradient fill" style="border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); overflow: hidden; padding-bottom: 10px">
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Fill type" value="gradient" options="{{types}}"></x-import></div>
        <div style="display: flex; gap: 6px; padding: 0 8px 10px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Gradient kind" value="linear" options="{{gkinds}}"></x-import><span style="flex: 1"></span><x-import component-from-global-scope="Drawpane.NumberField" label="°" aria-label="Angle" default-value="135"></x-import></div>
        <div style="position: relative; margin: 0 8px; height: 120px; border-radius: 6px; background: linear-gradient(135deg, #2b4fd6, #6d3fd6 55%, #e04f1a)">
          <span style="position: absolute; left: 14%; top: 18%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,.3)"></span>
          <span style="position: absolute; left: 14%; top: 18%; width: 74%; height: 2px; transform-origin: 0 50%; transform: rotate(31deg); background: #ffffff; opacity: .9"></span>
          <span style="position: absolute; left: 86%; top: 82%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,.3)"></span>
        </div>
        <div style="position: relative; margin: 14px 14px 18px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #2b4fd6, #6d3fd6 55%, #e04f1a)">
          <sc-for list="{{stops}}" as="s" hint-placeholder-count="3"><span style="{{s.style}}"></span></sc-for>
        </div>
        <div style="display: grid; gap: 4px; padding: 0 8px">
          <div style="display: flex; justify-content: space-between"><span class="dp-caption">Stops</span><x-import component-from-global-scope="Drawpane.IconButton" icon="plus" label="Add stop"></x-import></div>
          <sc-for list="{{stops}}" as="s" hint-placeholder-count="3">
            <div style="{{s.row}}"><span style="width: 40px; font-size: 12px; font-family: var(--font-mono)">{{s.pos}}</span><span style="{{s.sw}}"></span><span style="flex: 1; font-size: 12px; font-family: var(--font-mono)">{{s.hex}}</span><span style="font-size: 12px; color: var(--ink-muted)">100%</span><x-import component-from-global-scope="Drawpane.IconButton" icon="minus" label="Remove stop"></x-import></div>
          </sc-for>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px; width: 316px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted)">Image</figcaption>
      <div role="dialog" aria-label="Image fill" style="border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); overflow: hidden; padding-bottom: 10px">
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Fill type" value="image" options="{{types}}"></x-import></div>
        <div style="padding: 0 8px 8px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Scale mode" value="fill" options="{{scale}}"></x-import></div>
        <div style="position: relative; margin: 0 8px; height: 150px; border-radius: 6px; background: linear-gradient(160deg, #cfd8e3, #9fb3c8 50%, #6f7f94); overflow: hidden">
          <span style="position: absolute; left: 22%; bottom: 0; width: 44%; height: 56%; border-radius: 6px 6px 0 0; background: #e6d3c5"></span>
          <span style="position: absolute; right: 12%; top: 18%; width: 22%; height: 22%; border-radius: 50%; background: #fdf6e3"></span>
          <span style="position: absolute; left: 8px; bottom: 8px; display: inline-flex; gap: 6px"><x-import component-from-global-scope="Drawpane.Button" size="sm">Replace</x-import><x-import component-from-global-scope="Drawpane.Button" size="sm">Crop</x-import></span>
        </div>
        <div style="display: grid; gap: 8px; padding: 12px 8px 0">
          <sc-for list="{{adjust}}" as="a" hint-placeholder-count="5">
            <div style="display: grid; grid-template-columns: 76px 1fr 32px; align-items: center; gap: 8px; font-size: 12px"><span style="color: var(--ink-muted)">{{a.label}}</span><span style="position: relative; height: 4px; border-radius: 2px; background: var(--surface-sunken)"><span style="{{a.fill}}"></span></span><span style="text-align: right; font-family: var(--font-mono); font-size: 11px">{{a.val}}</span></div>
          </sc-for>
          <span class="dp-caption">2400 × 1600 · 412 KB · stored in R2, served as AVIF</span>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px; width: 316px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted)">Effects</figcaption>
      <div role="dialog" aria-label="Effects" style="border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 12px"><strong style="font-size: 12px">Effects</strong><x-import component-from-global-scope="Drawpane.IconButton" icon="plus" label="Add effect"></x-import></div>
        <sc-for list="{{effects}}" as="e" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 12px; font-size: 12px"><x-import component-from-global-scope="Drawpane.Icon" name="{{e.icon}}" size="12"></x-import><span style="flex: 1">{{e.name}}</span><span style="color: var(--ink-muted); font-size: 11px">{{e.meta}}</span><x-import component-from-global-scope="Drawpane.IconButton" icon="eye" label="Hide effect"></x-import></div>
        </sc-for>
        <div style="margin: 4px 8px 10px; padding: 10px; border-radius: var(--radius-sm); background: var(--surface-sunken); display: grid; gap: 8px">
          <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600">Drop shadow <x-import component-from-global-scope="Drawpane.TokenChip" name="shadow/raised" swatch="#16181d"></x-import></div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
            <x-import component-from-global-scope="Drawpane.NumberField" label="X" default-value="0"></x-import>
            <x-import component-from-global-scope="Drawpane.NumberField" label="Y" default-value="4"></x-import>
            <x-import component-from-global-scope="Drawpane.NumberField" label="B" aria-label="Blur" default-value="12"></x-import>
            <x-import component-from-global-scope="Drawpane.NumberField" label="S" aria-label="Spread" default-value="-2"></x-import>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="width: 16px; height: 16px; border-radius: 4px; background: #16181d"></span><span style="flex: 1; font-family: var(--font-mono)">16181D</span><span>14%</span></div>
          <x-import component-from-global-scope="Drawpane.Switch" checked="{{yes}}" label="Clip shadow behind transparent fills"></x-import>
        </div>
        <div style="display: grid; place-items: center; height: 120px; margin: 0 8px 10px; border-radius: var(--radius-sm); background: repeating-conic-gradient(#eceef1 0 25%, #f8f9fb 0 50%) 0 0 / 16px 16px">
          <span style="width: 120px; height: 64px; border-radius: 12px; background: #ffffff; box-shadow: 0 4px 12px -2px rgba(22,24,29,.14), inset 0 1px 0 rgba(255,255,255,.6)"></span>
        </div>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var stop = function (pos, hex, sel) {
      return { pos: pos + '%', hex: hex, style: 'position: absolute; left: ' + pos + '%; top: -4px; width: 14px; height: 20px; margin-left: -7px; box-sizing: border-box; border-radius: 4px; background: #' + hex + '; border: 2px solid #ffffff; box-shadow: 0 0 0 ' + (sel ? '2px var(--signal)' : '1px rgba(0,0,0,.3)'),
        sw: 'width: 16px; height: 16px; border-radius: 4px; background: #' + hex, row: 'display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 2px 0 6px; border-radius: var(--radius-sm);' + (sel ? ' background: var(--surface-active)' : '') };
    };
    var adj = function (l, v, w) { return { label: l, val: v, fill: 'position: absolute; left: 50%; top: 0; height: 4px; border-radius: 2px; background: var(--ink); ' + (w < 0 ? 'right: 50%; left: auto; width: ' + (-w) + '%' : 'width: ' + w + '%') }; };
    var sw = function (c) { return 'width: 20px; height: 20px; border-radius: 5px; background: ' + c + '; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1)'; };
    return {
      theme: T, yes: true,
      types: [{ value: 'solid', label: 'Solid' }, { value: 'gradient', label: 'Gradient' }, { value: 'image', label: 'Image' }, { value: 'video', label: 'Video' }],
      gkinds: [{ value: 'linear', label: 'Linear' }, { value: 'radial', label: 'Radial' }, { value: 'angular', label: 'Angular' }, { value: 'mesh', label: 'Mesh' }],
      scale: [{ value: 'fill', label: 'Fill' }, { value: 'fit', label: 'Fit' }, { value: 'crop', label: 'Crop' }, { value: 'tile', label: 'Tile' }],
      tokens: [{ n: 'brand/500', c: '#2b4fd6' }, { n: 'brand/700', c: '#1e3aa8' }, { n: 'gray/900', c: '#16181d' }, { n: 'gray/100', c: '#f3f4f6' }, { n: 'accent/500', c: '#e04f1a' }, { n: 'success', c: '#1d7a52' }],
      doc: ['#2b4fd6', '#16181d', '#ffffff', '#f3f4f6', '#e04f1a', '#ffd8c7', '#0f766e', '#fdf6e3'].map(sw),
      stops: [stop(0, '2B4FD6', false), stop(55, '6D3FD6', true), stop(100, 'E04F1A', false)],
      adjust: [adj('Exposure', '+8', 8), adj('Contrast', '0', 0), adj('Saturation', '−12', -12), adj('Temperature', '+20', 20), adj('Highlights', '0', 0)],
      effects: [{ icon: 'layers', name: 'Drop shadow', meta: '0 4 12 −2' }, { icon: 'layers', name: 'Inner shadow', meta: '0 1 0 0' }, { icon: 'eye', name: 'Background blur', meta: '24' }]
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
