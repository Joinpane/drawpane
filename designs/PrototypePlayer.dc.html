<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane prototype player</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: 900px; display: flex; flex-direction: column; background: #121316; color: #e6e7ea; font-family: var(--font-ui); overflow: hidden">
  <header class="u-row" style="height: 52px; padding: 0 14px; border-bottom: 1px solid #24262b">
    <span style="width: 18px; height: 18px; border-radius: 5px; background: #e6e7ea; box-shadow: inset -5px -5px 0 #ff7a45"></span>
    <span class="u-md u-b">Mobile app</span><span class="u-sm" style="color: #9aa0ab">· Onboarding v3</span>
    <span class="u-spacer"></span>
    <span class="u-row u-sm" style="height: 30px; padding: 0 10px; border-radius: 8px; background: #1d1f23">Flow: Onboarding <x-import component-from-global-scope="Drawpane.Icon" name="chevron-down" size="12"></x-import></span>
    <span class="u-row u-sm" style="height: 30px; padding: 0 10px; border-radius: 8px; background: #1d1f23">iPhone 16 · Dark <x-import component-from-global-scope="Drawpane.Icon" name="chevron-down" size="12"></x-import></span>
    <span class="u-tbtn">Restart</span><span class="u-tbtn">Comments · 3</span><span class="u-tbtn" style="background: #ff7a45; color: #1c1b19">Share</span>
  </header>
  <div style="flex: 1; display: flex; min-height: 0">
    <main style="flex: 1; position: relative; display: grid; place-items: center">
      <div style="position: relative; width: 364px; height: 584px; box-sizing: border-box; padding: 12px; border-radius: 52px; background: #0b0b0c; box-shadow: 0 0 0 1px #2c2f35, 0 30px 80px rgba(0,0,0,.5)">
        <div style="position: relative; width: 340px; height: 560px; border-radius: 40px; overflow: hidden">
          <dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import>
          <span style="position: absolute; left: 20px; top: 118px; width: 300px; height: 66px; border-radius: 14px; background: rgba(107,149,255,.28); box-shadow: inset 0 0 0 2px #6b95ff"></span>
          <span style="position: absolute; left: 32px; top: 212px; width: 276px; height: 52px; border-radius: 10px; background: rgba(107,149,255,.28); box-shadow: inset 0 0 0 2px #6b95ff"></span>
          <span style="position: absolute; left: 6px; top: 500px; width: 328px; height: 56px; border-radius: 10px; background: rgba(107,149,255,.28); box-shadow: inset 0 0 0 2px #6b95ff"></span>
        </div>
        <span style="position: absolute; left: 236px; top: 120px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 13px 13px 13px 2px; background: var(--presence-1); color: #ffffff; font-size: 11px; font-weight: 700">1</span>
      </div>
      <div class="u-row u-sm" style="position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: #1d1f23; color: #9aa0ab; white-space: nowrap">Tapped empty space · hotspots flash blue · press R to restart</div>
      <div class="u-row" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding: 0 16px; gap: 10px; border-top: 1px solid #24262b; justify-content: center">
        <sc-for list="{{strip}}" as="s" hint-placeholder-count="6"><div class="u-col" style="gap: 2px; justify-items: center"><span style="{{s.t}}"></span><span class="u-xs" style="{{s.l}}">{{s.n}}</span></div></sc-for>
      </div>
    </main>
    <aside style="width: 300px; border-left: 1px solid #24262b; background: #17181b; padding: 14px; display: grid; gap: 12px; align-content: start" aria-label="Comments">
      <div class="u-row"><strong class="u-md u-grow">Comments</strong><span class="u-xs" style="color: #9aa0ab">this screen</span></div>
      <sc-for list="{{cm}}" as="c" hint-placeholder-count="3"><div class="u-col u-col--tight" style="padding: 10px; border-radius: 10px; background: #1d1f23"><span class="u-row u-sm"><span class="u-av u-av--sm" style="{{c.st}}">{{c.i}}</span><strong>{{c.n}}</strong><span class="u-xs" style="color: #9aa0ab">{{c.w}}</span></span><span class="u-sm">{{c.t}}</span></div></sc-for>
      <div class="u-row u-sm" style="height: 36px; padding: 0 10px; border-radius: 8px; background: #1d1f23; color: #9aa0ab">Click anywhere on the screen to comment</div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var N = ['Welcome', 'Calendar', 'Reminders', 'Home', 'Event detail', 'Settings'];
    return {
      strip: N.map(function (n, i) { return { n: n, t: 'width: 28px; height: 44px; border-radius: 4px; background: ' + (i === 3 ? '#ffffff' : '#2a2c31') + '; box-shadow: 0 0 0 ' + (i === 3 ? '2px #ff7a45' : '1px #34373d'), l: 'color: ' + (i === 3 ? '#e6e7ea' : '#9aa0ab') }; }),
      cm: [{ i: 'AR', n: 'Ana', w: '2 h', t: 'Card should open Event detail, not Calendar', st: 'background: var(--presence-1)' }, { i: 'PL', n: 'Priya (client)', w: '1 h', t: 'Love the calmer header', st: 'background: var(--presence-7)' }]
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
