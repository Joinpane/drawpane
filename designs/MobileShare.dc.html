<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane phone, share</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-phone" style="background: var(--canvas)">
  <div style="flex: 1; position: relative">
    <div style="position: absolute; left: 25px; top: 60px; width: 340px; height: 560px; transform: scale(.9); transform-origin: top left; opacity: .5"><dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import></div>
    <div class="u-dim"></div>
    <section aria-label="Share" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 32px; border-radius: 18px 18px 0 0; background: var(--surface-raised); display: grid; gap: 14px">
      <span style="justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong)"></span>
      <div class="u-row"><strong class="u-lg u-grow">Share Home — iOS</strong><span class="u-sm u-muted">Mobile app</span></div>
      <div class="u-row" style="gap: 10px"><div class="u-input u-grow u-mono" style="font-size: 12px; height: 40px">design.acme.com/f/mobile-app?b=home</div><span class="u-btnlg u-btnlg--primary" style="padding: 0 16px">Copy</span></div>
      <div class="u-col u-col--tight"><span class="u-xs u-muted">Who can open it</span>
        <div class="u-row" style="padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-sunken)"><x-import component-from-global-scope="Drawpane.Icon" name="layers"></x-import><span class="u-grow u-col" style="gap: 0"><span class="u-md">Anyone at Acme with the link</span><span class="u-xs u-muted">Can view and comment</span></span><x-import component-from-global-scope="Drawpane.Icon" name="chevron-down" size="12"></x-import></div>
      </div>
      <div class="u-row" style="justify-content: space-between"><sc-for list="{{apps}}" as="a" hint-placeholder-count="5"><span class="u-col u-col--tight" style="justify-items: center"><span style="{{a.s}}">{{a.m}}</span><span class="u-xs">{{a.n}}</span></span></sc-for></div>
      <div class="u-row"><span class="u-btnlg u-grow">Invite people</span><span class="u-btnlg u-grow">Share prototype</span></div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var ap = function (n, m, bg) { return { n: n, m: m, s: 'display: grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: ' + bg + '; color: #ffffff; font-weight: 700' }; };
    return { apps: [ap('Slack', 'S', '#4a154b'), ap('Messages', 'M', '#28c840'), ap('Mail', '@', '#2b4fd6'), ap('Linear', 'L', '#5e6ad2'), ap('More', '…', '#5b616e')] };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
