<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane vector editing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <dc-import name="PartTopBar" tool="pen" file="Icon set" hint-size="100%,40px"></dc-import>
  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 12px">
    <aside aria-label="Layers" style="width: 248px; height: 824px; box-sizing: border-box; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); padding: 8px 4px">
      <div style="padding: 0 8px 8px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Left pane" value="layers" options="{{tabs}}"></x-import></div>
      <div role="tree" aria-label="Layers">
        <x-import component-from-global-scope="Drawpane.LayerRow" name="Icons · 24" kind="board" has-children="{{yes}}" expanded="{{yes}}"></x-import>
        <x-import component-from-global-scope="Drawpane.LayerRow" name="Leaf" kind="component" depth="1" has-children="{{yes}}" expanded="{{yes}}"></x-import>
        <x-import component-from-global-scope="Drawpane.LayerRow" name="Leaf shape" kind="path" depth="2" selected="{{yes}}"></x-import>
        <x-import component-from-global-scope="Drawpane.LayerRow" name="Vein" kind="path" depth="2"></x-import>
        <x-import component-from-global-scope="Drawpane.LayerRow" name="Drop" kind="component" depth="1" has-children="{{yes}}"></x-import>
        <x-import component-from-global-scope="Drawpane.LayerRow" name="Sun" kind="component" depth="1" has-children="{{yes}}"></x-import>
      </div>
    </aside>

    <main aria-label="Canvas, editing a path" style="flex: 999 1 560px; min-width: 0; height: 824px; position: relative">
      <div style="position: absolute; left: 50%; top: 60px; width: 480px; height: 480px; margin-left: -240px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,.06)">
        <span style="position: absolute; left: 0; top: -20px; font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-muted)">Leaf · 24 × 24 at 2000%</span>
        <svg width="480" height="480" viewBox="0 0 480 480" aria-hidden="true" style="position: absolute; inset: 0">
          <g stroke="#eef0f3" stroke-width="1"><path d="M20 0V480M40 0V480M60 0V480M80 0V480M100 0V480M120 0V480M140 0V480M160 0V480M180 0V480M200 0V480M220 0V480M240 0V480M260 0V480M280 0V480M300 0V480M320 0V480M340 0V480M360 0V480M380 0V480M400 0V480M420 0V480M440 0V480M460 0V480M0 20H480M0 40H480M0 60H480M0 80H480M0 100H480M0 120H480M0 140H480M0 160H480M0 180H480M0 200H480M0 220H480M0 240H480M0 260H480M0 280H480M0 300H480M0 320H480M0 340H480M0 360H480M0 380H480M0 400H480M0 420H480M0 440H480M0 460H480"></path></g>
          <path d="M100 380 C 100 220, 200 100, 380 100 C 380 280, 280 380, 100 380 Z" fill="#cdeee8" stroke="#0f766e" stroke-width="20" stroke-linejoin="round"></path>
          <path d="M100 380 L 300 180" fill="none" stroke="#0f766e" stroke-width="20" stroke-linecap="round"></path>
          <path d="M100 380 C 100 220, 200 100, 380 100 C 380 280, 280 380, 100 380 Z" fill="none" stroke="var(--signal)" stroke-width="1.5"></path>
          <g stroke="var(--icon)" stroke-width="1"><path d="M380 100 L 200 100"></path><path d="M380 100 L 380 280"></path><path d="M100 380 L 100 220"></path><path d="M100 380 L 280 380"></path></g>
          <circle cx="200" cy="100" r="4" fill="#ffffff" stroke="var(--icon)" stroke-width="1.25"></circle>
          <circle cx="380" cy="280" r="4" fill="#ffffff" stroke="var(--icon)" stroke-width="1.25"></circle>
          <circle cx="100" cy="220" r="4" fill="#ffffff" stroke="var(--icon)" stroke-width="1.25"></circle>
          <circle cx="280" cy="380" r="4" fill="#ffffff" stroke="var(--icon)" stroke-width="1.25"></circle>
          <rect x="95" y="375" width="10" height="10" fill="#ffffff" stroke="var(--signal)" stroke-width="1.5"></rect>
          <rect x="374" y="94" width="12" height="12" fill="var(--signal)" stroke="var(--signal)" stroke-width="1.5"></rect>
        </svg>
        <span style="position: absolute; left: 392px; top: 74px; padding: 1px 6px; border-radius: var(--radius-xs); background: var(--signal); color: var(--on-signal); font-family: var(--font-mono); font-size: 11px; line-height: 14px; font-weight: 500; white-space: nowrap">19, 5 · mirrored</span>
      </div>

      <div style="position: absolute; left: 50%; top: 560px; transform: translateX(-50%); white-space: nowrap">
        <x-import component-from-global-scope="Drawpane.SelectionLens" kind="Path · point 2 of 4" kind-icon="pen">
          <x-import component-from-global-scope="Drawpane.SegmentedControl" label="Point type" value="mirrored" options="{{points}}"></x-import>
          <x-import component-from-global-scope="Drawpane.NumberField" label="X" default-value="19"></x-import>
          <x-import component-from-global-scope="Drawpane.NumberField" label="Y" default-value="5"></x-import>
          <x-import component-from-global-scope="Drawpane.NumberField" label="◜" aria-label="Corner radius" default-value="0"></x-import>
        </x-import>
      </div>
      <div style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-pane); font-size: 11px; line-height: 14px; color: var(--ink-muted); white-space: nowrap">
        <span style="display: inline-flex; align-items: center; gap: 6px"><x-import component-from-global-scope="Drawpane.Kbd">⌥</x-import> break handle</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><x-import component-from-global-scope="Drawpane.Kbd">⇧</x-import> snap to 45°</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><x-import component-from-global-scope="Drawpane.Kbd">↵</x-import> done</span>
      </div>
    </main>

    <aside aria-label="Inspector" style="width: 264px; height: 824px; box-sizing: border-box; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); overflow: hidden">
      <div style="padding: 8px 12px 4px"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Right pane" value="design" options="{{modes}}"></x-import></div>
      <section class="dp-section" aria-label="Boolean">
        <div class="dp-section__head"><h3 class="dp-section__title">Combine shapes</h3></div>
        <div class="dp-section__body"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Boolean operation" value="none" options="{{bools}}"></x-import><span class="dp-caption">Select two or more shapes. Results stay editable.</span></div>
      </section>
      <section class="dp-section" aria-label="Stroke">
        <div class="dp-section__head"><h3 class="dp-section__title">Stroke</h3><x-import component-from-global-scope="Drawpane.IconButton" icon="more" label="Stroke options"></x-import></div>
        <div class="dp-section__body">
          <div class="dp-row" style="grid-template-columns: 1fr 72px"><x-import component-from-global-scope="Drawpane.NumberField" icon="rectangle" aria-label="Stroke color" token="teal/700" swatch="#0f766e"></x-import><x-import component-from-global-scope="Drawpane.NumberField" label="W" aria-label="Weight" default-value="1"></x-import></div>
          <div class="dp-row"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Caps" value="round" options="{{caps}}"></x-import><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Joins" value="round" options="{{joins}}"></x-import></div>
          <div class="dp-row"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Align" value="center" options="{{aligns}}"></x-import><x-import component-from-global-scope="Drawpane.NumberField" label="- -" aria-label="Dash" default-value="0"></x-import></div>
        </div>
      </section>
      <section class="dp-section" aria-label="Fill">
        <div class="dp-section__head"><h3 class="dp-section__title">Fill</h3></div>
        <div class="dp-section__body"><div class="dp-row" style="grid-template-columns: 1fr 72px"><x-import component-from-global-scope="Drawpane.NumberField" icon="rectangle" aria-label="Fill" token="teal/100" swatch="#cdeee8"></x-import><x-import component-from-global-scope="Drawpane.NumberField" label="%" default-value="100"></x-import></div></div>
      </section>
      <section class="dp-section" aria-label="Path">
        <div class="dp-section__head"><h3 class="dp-section__title">Path</h3></div>
        <div class="dp-section__body" style="grid-template-columns: 1fr 1fr">
          <x-import component-from-global-scope="Drawpane.Button" size="sm">Flatten</x-import>
          <x-import component-from-global-scope="Drawpane.Button" size="sm">Outline stroke</x-import>
          <x-import component-from-global-scope="Drawpane.Button" size="sm">Simplify</x-import>
          <x-import component-from-global-scope="Drawpane.Button" size="sm">Reverse</x-import>
        </div>
      </section>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      yes: true,
      tabs: [{ value: 'layers', label: 'Layers' }, { value: 'assets', label: 'Assets' }, { value: 'history', label: 'History' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }],
      points: [{ value: 'corner', label: 'Corner' }, { value: 'mirrored', label: 'Mirror' }, { value: 'free', label: 'Free' }],
      bools: [{ value: 'union', label: 'Union' }, { value: 'subtract', label: 'Subtract' }, { value: 'intersect', label: 'Intersect' }, { value: 'exclude', label: 'Exclude' }],
      caps: [{ value: 'butt', label: 'Butt' }, { value: 'round', label: 'Round' }, { value: 'square', label: 'Sq' }],
      joins: [{ value: 'miter', label: 'Miter' }, { value: 'round', label: 'Round' }, { value: 'bevel', label: 'Bevel' }],
      aligns: [{ value: 'inside', label: 'In' }, { value: 'center', label: 'Mid' }, { value: 'outside', label: 'Out' }]
    };
  }
}
</script>
</body>
</html>
