<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane tablet, editing with a pencil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 1180px; height: 820px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-ui)">
  <header style="position: absolute; left: 16px; right: 16px; top: 28px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane)">
    <span style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--icon)"><x-import component-from-global-scope="Drawpane.Icon" name="layers"></x-import></span>
    <span style="flex: 1; display: grid"><span style="font-size: 15px; font-weight: 600">Mobile app</span><span style="font-size: 12px; color: var(--ink-muted)">Home · main</span></span>
    <x-import component-from-global-scope="Drawpane.PresenceStack" people="{{people}}"></x-import>
    <span style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--icon)"><x-import component-from-global-scope="Drawpane.Icon" name="agent"></x-import></span>
    <span style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--icon)"><x-import component-from-global-scope="Drawpane.Icon" name="play"></x-import></span>
    <span style="height: 36px; padding: 0 14px; border-radius: var(--radius-md); background: var(--surface-inverse); color: var(--ink-inverse); font-size: 14px; line-height: 36px; font-weight: 600">Share</span>
  </header>

  <div style="position: absolute; left: 120px; top: 110px; width: 340px; height: 560px"><dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import></div>
  <div style="position: absolute; left: 500px; top: 110px; width: 340px; height: 560px; border-radius: 28px; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.12); overflow: hidden">
    <svg viewBox="0 0 340 560" width="340" height="560" aria-label="Pencil sketch of a new screen" role="img">
      <path d="M30 70 C 80 66, 200 64, 300 70" fill="none" stroke="#16181d" stroke-width="3" stroke-linecap="round"/>
      <path d="M30 110 C 30 108, 300 106, 300 112 L 302 220 C 220 224, 100 224, 32 218 Z" fill="none" stroke="#16181d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M52 140 L 150 138" stroke="#16181d" stroke-width="2" stroke-linecap="round"/>
      <path d="M52 166 L 220 164" stroke="#8a8f99" stroke-width="2" stroke-linecap="round"/>
      <circle cx="262" cy="160" r="22" fill="none" stroke="#e04f1a" stroke-width="2.4"/>
      <path d="M30 260 L 300 262 M30 310 L 300 312 M30 360 L 210 362" stroke="#8a8f99" stroke-width="2" stroke-linecap="round" stroke-dasharray="0"/>
    </svg>
    <span aria-hidden="true" style="position: absolute; left: 22px; top: 100px; width: 288px; height: 130px; border: 1.5px dashed var(--agent); border-radius: 10px"></span>
  </div>
  <div style="position: absolute; left: 640px; top: 250px; display: grid; justify-items: start; gap: 2px">
    <span style="padding: 1px 6px; border-radius: 4px; background: var(--agent); color: var(--on-agent); font-size: 11px; line-height: 16px; font-weight: 600">Sketch to design · reading your sketch</span>
  </div>
  <div role="dialog" aria-label="Turn sketch into design" style="position: absolute; left: 860px; top: 120px; width: 280px; padding: 14px; box-sizing: border-box; border-radius: var(--radius-lg); background: var(--surface-raised); box-shadow: var(--shadow-popover); display: grid; gap: 10px">
    <x-import component-from-global-scope="Drawpane.AgentTag" name="Sketch agent" status="working" on-behalf-of="you"></x-import>
    <span style="font-size: 13px; line-height: 18px">Looks like a card with a title, a subtitle and an avatar, then a list. I'll build it with Hero card and Event row from your library.</span>
    <x-import component-from-global-scope="Drawpane.AgentStep" label="Match shapes to components" status="done" detail="Hero card · Event row ×3"></x-import>
    <x-import component-from-global-scope="Drawpane.AgentStep" label="Build on branch sketch/home-2" status="running"></x-import>
    <div style="display: flex; gap: 8px"><span style="flex: 1; height: 36px; border-radius: var(--radius-md); background: var(--surface-sunken); display: grid; place-items: center; font-size: 14px; font-weight: 600">Keep sketch</span><span style="flex: 1; height: 36px; border-radius: var(--radius-md); background: var(--surface-inverse); color: var(--ink-inverse); display: grid; place-items: center; font-size: 14px; font-weight: 600">Stop</span></div>
  </div>

  <div aria-label="Pencil quick menu" style="position: absolute; left: 820px; top: 470px; width: 132px; height: 132px; border-radius: 50%; background: var(--surface-raised); box-shadow: var(--shadow-popover)">
    <sc-for list="{{radial}}" as="r" hint-placeholder-count="6"><span style="{{r.s}}"><x-import component-from-global-scope="Drawpane.Icon" name="{{r.icon}}"></x-import></span></sc-for>
    <span style="position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px; border-radius: 50%; background: var(--surface-sunken); display: grid; place-items: center; font-size: 10px; color: var(--ink-muted)">2×tap</span>
  </div>

  <nav aria-label="Tools" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-popover)">
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="8"><span style="{{t.s}}"><x-import component-from-global-scope="Drawpane.Icon" name="{{t.icon}}"></x-import></span></sc-for>
    <span style="width: 1px; height: 28px; margin: 0 6px; background: var(--line)"></span>
    <sc-for list="{{inks}}" as="c" hint-placeholder-count="4"><span style="{{c}}"></span></sc-for>
    <span style="margin-left: 6px; font-size: 12px; color: var(--ink-muted)">2.4 pt · pressure</span>
  </nav>
  <div role="status" style="position: absolute; left: 16px; bottom: 28px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--surface-inverse); color: var(--ink-inverse); font-size: 12px; line-height: 16px; max-width: 220px">Pencil draws, fingers pan and pinch. Palm rejection on.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1180, "height": 820}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var tb = function (sel) { return 'display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: ' + (sel ? 'var(--on-signal)' : 'var(--icon)') + '; background: ' + (sel ? 'var(--signal)' : 'transparent'); };
    var pos = [[48, 6], [86, 26], [86, 70], [48, 90], [10, 70], [10, 26]];
    var ri = ['pen', 'text', 'rectangle', 'comment', 'agent', 'history'];
    return {
      theme: T,
      people: [{ name: 'Lena Park', color: 2 }, { name: 'Sam Okafor', color: 3 }],
      tools: [['pointer', 0], ['pen', 1], ['rectangle', 0], ['ellipse', 0], ['text', 0], ['image', 0], ['comment', 0], ['hand', 0]].map(function (t) { return { icon: t[0], s: tb(t[1]) }; }),
      inks: ['#16181d', '#8a8f99', '#e04f1a', '#2b4fd6'].map(function (c, i) { return 'width: 28px; height: 28px; border-radius: 50%; background: ' + c + '; box-shadow: 0 0 0 ' + (i === 0 ? '2px var(--surface), 0 0 0 4px var(--signal)' : '1px var(--line)'); }),
      radial: ri.map(function (ic, i) { return { icon: ic, s: 'position: absolute; left: ' + pos[i][0] + 'px; top: ' + pos[i][1] + 'px; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--icon);' + (i === 4 ? ' background: var(--agent-soft); color: var(--agent-ink)' : '') }; })
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
