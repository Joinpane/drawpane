<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane long strings and right-to-left</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-sheet">
  <header class="u-sheethead"><h1 class="u-h1">Drawpane in other languages</h1><p class="u-lead">The interface is translated, not just the designs. Layouts are built to survive German length and mirror cleanly for right-to-left.</p></header>
  <div class="u-grid">
    <figure class="u-fig" style="width: 420px">
      <figcaption class="u-cap">German · longest strings</figcaption>
      <div class="u-pane" style="width: 420px">
        <div class="u-head"><h2 class="u-h3">Ebenen</h2><span class="u-xs u-muted">Seiten · 9</span></div>
        <div class="u-list"><sc-for list="{{de}}" as="d" hint-placeholder-count="4"><span class="u-item {{d.sel}}"><x-import component-from-global-scope="Drawpane.Icon" name="{{d.i}}" size="12"></x-import><span class="u-grow u-ellip">{{d.t}}</span></span></sc-for></div>
        <div class="u-col" style="padding: 12px 14px; border-top: 1px solid var(--line)">
          <x-import component-from-global-scope="Drawpane.SegmentedControl" label="Bereich" value="design" options="{{deTabs}}"></x-import>
          <x-import component-from-global-scope="Drawpane.Switch" checked="{{H.yes}}" label="Änderungen nur auf einem Zweig vornehmen, nicht auf dem Hauptzweig"></x-import>
          <div class="u-row"><x-import component-from-global-scope="Drawpane.Button" size="sm">Abbrechen</x-import><x-import component-from-global-scope="Drawpane.Button" size="sm" variant="primary">Zusammenführen und veröffentlichen</x-import></div>
        </div>
      </div>
    </figure>
    <figure class="u-fig" style="width: 420px">
      <figcaption class="u-cap">Arabic · whole interface mirrored</figcaption>
      <div class="u-pane" dir="rtl" style="width: 420px; text-align: right">
        <div class="u-head"><h2 class="u-h3">الوكيل</h2><x-import component-from-global-scope="Drawpane.AgentTag" name="Claude" status="working"></x-import></div>
        <div class="u-col" style="padding: 0 14px 14px">
          <div style="justify-self: start; padding: 8px 10px; border-radius: var(--radius-md); background: var(--surface-sunken)" class="u-sm">أضف حالات فارغة لقائمة المواعيد القادمة</div>
          <div role="list" style="display: grid; gap: 2px">
            <x-import component-from-global-scope="Drawpane.AgentStep" status="done" label="قراءة اللوحة ومكتبة Acme" meta="٢ ث"></x-import>
            <x-import component-from-global-scope="Drawpane.AgentStep" status="running" label="إضافة حالة فارغة" ops="insert EmptyState"></x-import>
          </div>
          <div class="u-row"><x-import component-from-global-scope="Drawpane.Button" size="sm">إيقاف</x-import><x-import component-from-global-scope="Drawpane.Button" size="sm" variant="primary">مراجعة</x-import></div>
          <span class="u-xs u-muted">Code, token names and numbers stay left-to-right inside mirrored panes.</span>
        </div>
      </div>
    </figure>
    <figure class="u-fig" style="width: 360px">
      <figcaption class="u-cap">Japanese · line breaking and sizes</figcaption>
      <div class="u-pane u-col" style="padding: 14px">
        <strong class="u-md">コメント</strong>
        <div class="u-row u-row--top"><span class="u-av u-av--sm" style="background: var(--presence-1)">AR</span><span class="u-sm">このタイトルをもう少し大きくできますか？ 腕を伸ばした距離だと読みにくいです。</span></div>
        <div class="u-row u-row--top"><span class="u-av u-av--sm" style="background: var(--presence-2)">LP</span><span class="u-sm">賛成です。type/title-lg を使いましょう。</span></div>
        <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="primary">返信</x-import>
      </div>
      <figcaption class="u-cap" style="margin-top: 12px">Rules every string follows</figcaption>
      <div class="u-pane u-col" style="padding: 14px">
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="4"><div class="u-row u-row--top u-sm"><span class="u-ico u-ico--ok u-ico--sm"><x-import component-from-global-scope="Drawpane.Icon" name="check" size="12"></x-import></span><span class="u-grow">{{r}}</span></div></sc-for>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    return {
      de: [{ i: 'board', t: 'Startseite — iOS', sel: '' }, { i: 'layout-col', t: 'Bevorstehende Termine', sel: 'is-sel' }, { i: 'instance', t: 'Terminzeile', sel: '' }, { i: 'instance', t: 'Navigationsleiste unten', sel: '' }],
      deTabs: H.opts([{ value: 'design', label: 'Gestaltung' }, { value: 'proto', label: 'Prototyp' }, { value: 'insp', label: 'Prüfen' }]),
      rules: ['Buttons grow with their label; no fixed widths', 'Truncate with a tooltip, never mid-word in a heading', 'Icons that point (back, next) mirror; others don\'t', 'Numbers, code and shortcuts stay left-to-right']
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
