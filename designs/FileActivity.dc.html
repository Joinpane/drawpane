<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane file activity</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-editor">
  <dc-import name="PartTopBar" hint-size="100%,40px"></dc-import>
  <div class="u-work">
    <dc-import name="PartLayers" selected="none" hint-size="248px,824px"></dc-import>
    <main class="u-stage" aria-label="Canvas"><div style="position: absolute; left: 140px; top: 60px; width: 340px; height: 560px"><dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import><span class="u-outline" style="left: 20px; top: 118px; width: 300px; height: 66px; border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--presence-2)"></span></div></main>
    <aside class="u-side u-side--wide" aria-label="Activity">
      <div class="u-head"><h2 class="u-h3">Activity</h2><x-import component-from-global-scope="Drawpane.IconButton" icon="close" label="Close"></x-import></div>
      <div class="u-row" style="padding: 0 14px 8px; gap: 4px; flex-wrap: wrap"><sc-for list="{{f}}" as="x" hint-placeholder-count="5"><span class="u-pill {{x.on}}" style="height: 24px; padding: 0 9px">{{x.t}}</span></sc-for></div>
      <div style="padding: 0 14px; overflow: hidden">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
          <div class="u-cap" style="margin: 10px 0 4px">{{d.day}}</div>
          <sc-for list="{{d.items}}" as="i" hint-placeholder-count="4">
            <div class="u-row u-row--top" style="padding: 7px 0; border-top: 1px solid var(--line)">
              <span class="{{i.avc}}" style="{{i.avs}}">{{i.ini}}</span>
              <span class="u-grow u-col" style="gap: 2px"><span class="u-sm"><strong>{{i.who}}</strong> {{i.what}}</span><span class="u-xs u-muted">{{i.when}}</span></span>
            </div>
          </sc-for>
        </sc-for>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var it = function (ini, who, what, when) { var p = H.p(ini); return { ini: ini, avc: p.cls + ' u-av--sm', avs: p.st, who: who, what: what, when: when }; };
    return {
      f: [{ t: 'All', on: 'is-on' }, { t: 'People', on: '' }, { t: 'Agents', on: '' }, { t: 'Comments', on: '' }, { t: 'Versions', on: '' }],
      days: [
        { day: 'Today', items: [it('LP', 'Lena', 'changed Hero card fill to brand/500', '11:02 · main'), it('AI', 'Empty states agent', 'added 2 boards on agent/empty-states', '10:14 · for Sam'), it('AR', 'Ana', 'commented on Greeting: "can we use the larger title?"', '10:05'), it('Z', 'Ziyang', 'synced 38 offline changes', '11:40')] },
        { day: 'Yesterday', items: [it('SO', 'Sam', 'merged feature/calendar-week', '17:20 · 42 changes'), it('LP', 'Lena', 'saved version "Type scale"', '15:02'), it('AI', 'Copy editor', "couldn't finish: library permission", '14:41 · for Mo'), it('DP', 'Dev', 'marked Home ready for dev', '11:10')] }
      ]
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
