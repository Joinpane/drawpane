<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane annotations</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-editor">
  <dc-import name="PartTopBar" hint-size="100%,40px"></dc-import>
  <div class="u-work">
    <dc-import name="PartLayers" selected="hero" hint-size="248px,824px"></dc-import>
    <main class="u-stage" aria-label="Annotated board">
      <div class="u-pop u-row" style="position: absolute; left: 50%; top: 4px; transform: translateX(-50%); padding: 4px; white-space: nowrap"><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Annotate" value="note" options="{{tools}}"></x-import><span class="u-xs u-muted" style="padding: 0 8px">Visible in Inspect and spec pages</span></div>
      <div style="position: absolute; left: 200px; top: 70px; width: 340px; height: 560px">
        <dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import>
        <span style="position: absolute; left: 170px; top: 184px; width: 1px; height: 16px; background: var(--guide)"></span>
        <span class="u-label u-label--guide" style="left: 176px; top: 184px">16</span>
        <span style="position: absolute; left: 0; top: 150px; width: 20px; height: 1px; background: var(--guide)"></span>
        <span class="u-label u-label--guide" style="left: -26px; top: 142px">20</span>
        <span class="u-outline u-outline--guide" style="left: 20px; top: 118px; width: 300px; height: 66px; border-radius: 14px"></span>
        <span class="u-outline u-outline--guide" style="left: 6px; top: 500px; width: 328px; height: 56px; border-radius: 10px"></span>
      </div>
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
        <div style="{{n.box}}"><div class="u-row u-xs"><span class="u-chip u-chip--muted">{{n.k}}</span><strong class="u-sm">{{n.t}}</strong></div><span class="u-xs" style="display: block; margin-top: 4px; color: var(--ink)">{{n.d}}</span></div>
        <span style="{{n.line}}"></span>
      </sc-for>
    </main>
    <aside class="u-side" aria-label="Annotations list">
      <div class="u-head"><h2 class="u-h3">Annotations · 4</h2><x-import component-from-global-scope="Drawpane.Switch" checked="{{H.yes}}" aria-label="Show annotations"></x-import></div>
      <div class="u-list">
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="4"><div class="u-item" style="align-items: flex-start"><span class="u-chip u-chip--muted">{{n.k}}</span><span class="u-grow u-col" style="gap: 0"><span class="u-sm u-b">{{n.t}}</span><span class="u-xs u-muted">{{n.layer}}</span></span></div></sc-for>
      </div>
      <div class="u-xs u-muted" style="padding: 12px 14px; margin-top: auto; border-top: 1px solid var(--line)">Annotations attach to layers, so they move with them and show up for agents as instructions too.</div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var nt = function (k, t, d, layer, x, y, lx, ly, lw) { return { k: k, t: t, d: d, layer: layer, box: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: 180px; padding: 8px 10px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--warning) 18%, var(--surface-raised)); box-shadow: var(--shadow-popover)', line: 'position: absolute; left: ' + lx + 'px; top: ' + ly + 'px; width: ' + lw + 'px; height: 1px; background: var(--warning)' }; };
    return {
      tools: H.opts([{ value: 'note', label: 'Note' }, { value: 'measure', label: 'Measure' }, { value: 'spec', label: 'Spec' }]),
      notes: [
        nt('Behavior', 'Tap opens Event detail', 'Card is a button. Long press: quick actions.', 'Hero card', 560, 170, 540, 220, 20),
        nt('Content', 'Greeting by time of day', 'Morning until 12:00, afternoon until 18:00.', 'Greeting', 0, 100, 180, 140, 40),
        nt('A11y', 'Tab bar labels', 'VoiceOver reads "Home, tab, 1 of 4".', 'Tab bar', 560, 560, 540, 600, 20),
        nt('Data', 'Max 3 events', 'Then "See all" link. Empty state if none.', 'Upcoming', 0, 330, 180, 360, 52)
      ]
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
