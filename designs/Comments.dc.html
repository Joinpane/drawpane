<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane comments</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: 900px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--canvas); color: var(--ink); font-family: var(--font-ui); overflow: hidden">
  <dc-import name="PartTopBar" tool="comment" hint-size="100%,40px"></dc-import>
  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 12px">
    <dc-import name="PartLayers" selected="none" hint-size="248px,824px"></dc-import>

    <main aria-label="Canvas with comments" style="flex: 999 1 560px; min-width: 0; height: 824px; position: relative">
      <div style="position: absolute; left: calc(50% - 260px); top: 40px; width: 340px; height: 560px">
        <span style="position: absolute; left: 0; top: -20px; font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-muted)">Home — iOS</span>
        <dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import>

        <button type="button" aria-label="Comment by Sam, resolved" style="position: absolute; left: 290px; top: 52px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 13px 13px 13px 2px; background: var(--surface-raised); box-shadow: var(--shadow-popover), inset 0 0 0 2px var(--success); color: var(--success); display: grid; place-items: center; cursor: pointer"><x-import component-from-global-scope="Drawpane.Icon" name="check" size="12"></x-import></button>
        <button type="button" aria-label="Open thread by Ana, 3 replies" style="position: absolute; left: 300px; top: 104px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 14px 14px 14px 2px; background: var(--signal); color: var(--on-signal); font: 700 11px/1 var(--font-ui); box-shadow: 0 0 0 3px var(--signal-soft); cursor: pointer">AR</button>
        <button type="button" aria-label="Thread by Lena, 1 reply" style="position: absolute; left: 6px; top: 300px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 13px 13px 13px 2px; background: var(--surface-raised); box-shadow: var(--shadow-popover), inset 0 0 0 2px var(--presence-2); color: var(--ink); font: 700 10px/1 var(--font-ui); cursor: pointer">LP</button>
      </div>

      <div role="dialog" aria-label="Thread on Hero card" style="position: absolute; left: calc(50% + 88px); top: 96px; width: 320px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); overflow: visible">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 8px 8px 12px; border-bottom: 1px solid var(--line)">
          <span style="flex: 1; font-size: 12px; line-height: 16px; font-weight: 600">Hero card · Home — iOS</span>
          <x-import component-from-global-scope="Drawpane.IconButton" icon="check" label="Resolve thread" shortcut="⌘ ⇧ R"></x-import>
          <x-import component-from-global-scope="Drawpane.IconButton" icon="more" label="Thread options"></x-import>
        </div>
        <div style="display: grid; gap: 14px; padding: 12px">
          <sc-for list="{{thread}}" as="m" hint-placeholder-count="3">
            <div style="display: grid; grid-template-columns: 24px 1fr; gap: 8px">
              <span style="{{m.avatar}}">{{m.initials}}</span>
              <div style="display: grid; gap: 2px; font-size: 12px; line-height: 17px">
                <span><b style="font-weight: 600">{{m.name}}</b> <span style="color: var(--ink-muted)">· {{m.when}}</span></span>
                <span>{{m.text}}</span>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="position: relative; margin: 0 12px 12px; padding: 8px 10px; border: 1px solid var(--signal); border-radius: var(--radius-sm); background: var(--surface-raised); font-size: 12px; line-height: 17px">
          <span>Looks good. Can </span><span style="color: var(--signal-ink); font-weight: 600">@Le</span><span style="display: inline-block; width: 1.5px; height: 14px; margin-left: 1px; vertical-align: -2px; background: var(--signal)"></span>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--ink-muted); font-size: 11px">
            <span>Attach the selection with <b style="font-weight: 600; color: var(--ink)">#</b></span>
            <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="primary" shortcut="⌘ ↵">Reply</x-import>
          </div>
          <div style="position: absolute; left: 70px; top: 30px; width: 220px; z-index: 2">
            <x-import component-from-global-scope="Drawpane.Menu" label="Mention" items="{{mentions}}"></x-import>
          </div>
        </div>
      </div>
    </main>

    <aside aria-label="All comments" style="width: 264px; height: 824px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 6px 6px 12px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600">Comments</span>
        <x-import component-from-global-scope="Drawpane.IconButton" icon="search" label="Search comments"></x-import>
      </div>
      <div style="padding: 0 12px 8px; border-bottom: 1px solid var(--line)">
        <x-import component-from-global-scope="Drawpane.SegmentedControl" label="Filter" value="open" options="{{filters}}"></x-import>
      </div>
      <div style="flex: 1; min-height: 0; padding: 4px">
        <sc-for list="{{list}}" as="c" hint-placeholder-count="4">
          <article style="{{c.row}}">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px">
              <span style="{{c.avatar}}">{{c.initials}}</span>
              <b style="font-weight: 600">{{c.name}}</b><span style="color: var(--ink-muted)">· {{c.when}}</span>
              <span style="flex: 1"></span>
              <span style="font-size: 11px; color: var(--ink-muted)">{{c.replies}}</span>
            </div>
            <p style="margin: 4px 0 0; font-size: 12px; line-height: 17px">{{c.text}}</p>
            <span style="font-size: 11px; line-height: 14px; color: var(--ink-muted)">{{c.where}}</span>
          </article>
        </sc-for>
      </div>
      <div style="padding: 10px 12px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-size: 11px; line-height: 14px; color: var(--ink-muted)">
        <span>Email digest: once a day</span>
        <a href="#" style="color: var(--signal-ink); font-weight: 600; text-decoration: none">Change</a>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var av = function (slot) { return 'display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--surface-raised); font-size: 9.5px; font-weight: 700; color: var(--ink); box-shadow: inset 0 0 0 2px var(--presence-' + slot + ')'; };
    var row = 'padding: 10px 8px; border-radius: var(--radius-sm); border-bottom: 1px solid var(--line);';
    return {
      theme: this.props.theme ?? 'light',
      thread: [
        { name: 'Ana Ruiz', initials: 'AR', when: '2h', text: 'Should the hero follow the brand blue now that the tab bar uses it?', avatar: av(1) },
        { name: 'Lena Park', initials: 'LP', when: '1h', text: 'Tried it on feature/greeting. It reads better, review is open.', avatar: av(2) },
        { name: 'Sam Okafor', initials: 'SO', when: '20m', text: 'Approved. One note on the subtitle contrast, fixed already.', avatar: av(3) }
      ],
      mentions: [
        { heading: 'People in this file' },
        { label: 'Lena Park', icon: 'comment', active: true },
        { label: 'Lee Huang', icon: 'comment' },
        { separator: true },
        { label: 'Notify everyone on the file', icon: 'layers' }
      ],
      filters: [{ value: 'open', label: 'Open 3' }, { value: 'mine', label: 'Mine' }, { value: 'resolved', label: 'Resolved' }],
      list: [
        { name: 'Ana Ruiz', initials: 'AR', when: '2h', replies: '3 replies', text: 'Should the hero follow the brand blue now that the tab bar uses it?', where: 'Hero card · Home — iOS', avatar: av(1), row: row + ' background: var(--signal-soft);' },
        { name: 'Lena Park', initials: 'LP', when: '5h', replies: '1 reply', text: 'Rows feel tight on small phones. Try gap 12?', where: 'Upcoming · Home — iOS', avatar: av(2), row: row },
        { name: 'Dev Patel', initials: 'DP', when: 'Yesterday', replies: 'New', text: 'Is the tab bar locked on purpose? I need to swap the icon set.', where: 'Tab bar · Home — iOS', avatar: av(4), row: row }
      ]
    };
  }
}
</script>
</body>
</html>
