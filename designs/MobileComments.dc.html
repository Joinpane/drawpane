<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane on a phone, comment thread</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-ui)">
  <header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 4px; border-bottom: 1px solid var(--line)">
    <button type="button" aria-label="Back to comments" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--icon); cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.75 4.5L6.25 8l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <span style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 15px; line-height: 20px; font-weight: 600">Hero card</span>
      <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted)">Mobile app · Home — iOS</span>
    </span>
    <button type="button" aria-label="Resolve thread" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--icon); cursor: pointer"><x-import component-from-global-scope="Drawpane.Icon" name="check"></x-import></button>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: grid; gap: 18px; align-content: start">
    <div style="position: relative; height: 132px; border-radius: var(--radius-md); background: var(--canvas); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line)">
      <div style="position: absolute; left: 16px; top: -100px; transform: scale(1); transform-origin: top left">
        <dc-import name="PartBoard" variant="default" hint-size="340px,560px"></dc-import>
      </div>
      <span aria-hidden="true" style="position: absolute; left: 36px; top: 18px; width: 300px; height: 66px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--signal)"></span>
      <span style="position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: var(--surface-raised); box-shadow: var(--shadow-popover); font-size: 11px; line-height: 14px; font-weight: 600">Open on canvas</span>
    </div>

    <sc-for list="{{thread}}" as="m" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 32px 1fr; gap: 10px">
        <span style="{{m.avatar}}">{{m.initials}}</span>
        <div style="display: grid; gap: 4px">
          <span style="font-size: 14px; line-height: 20px"><b style="font-weight: 600">{{m.name}}</b> <span style="color: var(--ink-muted)">· {{m.when}}</span></span>
          <span style="font-size: 15px; line-height: 22px">{{m.text}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <form style="display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px 24px; border-top: 1px solid var(--line); background: var(--surface)">
    <label for="reply" style="position: absolute; left: -9999px">Reply</label>
    <textarea id="reply" rows="1" placeholder="Reply, or @ to mention" style="flex: 1; min-height: 44px; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--line-control); border-radius: 22px; background: var(--surface-raised); color: var(--ink); font: 400 15px/20px var(--font-ui); resize: none"></textarea>
    <button type="button" aria-label="Send reply" style="display: grid; place-items: center; width: 44px; height: 44px; flex: none; padding: 0; border: 0; border-radius: 50%; background: var(--signal); color: var(--on-signal); cursor: pointer"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5V3.5M4.5 7L8 3.5 11.5 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var av = function (slot) { return 'display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-raised); font-size: 11px; font-weight: 700; color: var(--ink); box-shadow: inset 0 0 0 2px var(--presence-' + slot + ')'; };
    return {
      theme: this.props.theme ?? 'light',
      thread: [
        { name: 'Ana Ruiz', initials: 'AR', when: '2h', text: 'Should the hero follow the brand blue now that the tab bar uses it?', avatar: av(1) },
        { name: 'Lena Park', initials: 'LP', when: '1h', text: 'Tried it on feature/greeting. It reads better, review is open.', avatar: av(2) },
        { name: 'Sam Okafor', initials: 'SO', when: '20m', text: 'Approved. One note on the subtitle contrast, fixed already.', avatar: av(3) }
      ]
    };
  }
}
</script>
</body>
</html>
