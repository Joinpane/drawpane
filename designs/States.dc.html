<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane system states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 900px; box-sizing: border-box; padding: 32px; background: var(--canvas); color: var(--ink); font-family: var(--font-ui)">
  <div style="max-width: 1376px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px">

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">Offline · edits keep working</figcaption>
      <div style="padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); display: grid; gap: 12px">
        <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); font-size: 12px; line-height: 16px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--warning)"></span>
          <span style="flex: 1"><b style="font-weight: 600">You're offline.</b> 12 edits saved on this device and will sync when you reconnect.</span>
        </div>
        <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover); font-size: 12px; line-height: 16px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--info)"></span>
          <span style="flex: 1">Reconnecting… merging 12 edits with 4 from Lena</span>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">Offline conflict · one decision, not a dialog storm</figcaption>
      <div style="padding: 16px; border-radius: var(--radius-lg); background: var(--surface-raised); box-shadow: var(--shadow-popover); display: grid; gap: 12px">
        <div style="font-size: 13px; line-height: 18px; font-weight: 600">You and Lena both changed Hero card fill</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="display: grid; gap: 6px; justify-items: start; padding: 10px; border: 1px solid var(--signal); border-radius: var(--radius-sm); background: var(--signal-soft); color: var(--ink); cursor: pointer; text-align: left">
            <span style="width: 100%; height: 28px; border-radius: 6px; background: #2b4fd6"></span>
            <span style="font-size: 12px; line-height: 16px; font-weight: 600">Yours · 10:42 offline</span>
          </button>
          <button type="button" style="display: grid; gap: 6px; justify-items: start; padding: 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--ink); cursor: pointer; text-align: left">
            <span style="width: 100%; height: 28px; border-radius: 6px; background: #0f766e"></span>
            <span style="font-size: 12px; line-height: 16px; font-weight: 600">Lena's · 10:47</span>
          </button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-muted)">
          <span>11 other edits merged cleanly</span>
          <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="primary">Keep yours</x-import>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">View-only access</figcaption>
      <div style="padding: 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
        <span style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--icon)"><x-import component-from-global-scope="Drawpane.Icon" name="eye"></x-import></span>
        <span style="flex: 1 1 200px; font-size: 13px; line-height: 18px"><b style="font-weight: 600">You can view and comment.</b> Inspect and export are on.</span>
        <x-import component-from-global-scope="Drawpane.Button" size="sm">Request edit access</x-import>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">Toasts · bottom center, one at a time</figcaption>
      <div style="padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); display: grid; gap: 10px; justify-items: center">
        <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: var(--radius-md); background: var(--surface-inverse); color: var(--ink-inverse); font-size: 12px; line-height: 16px">
          <span>Merged feature/greeting into main</span>
          <button type="button" style="height: 24px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: transparent; box-shadow: inset 0 0 0 1px currentColor; color: inherit; font: 600 12px/16px var(--font-ui); cursor: pointer">Undo</button>
        </div>
        <div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-popover), inset 0 0 0 1px var(--danger); font-size: 12px; line-height: 16px">
          <span style="display: inline-flex; color: var(--danger)"><x-import component-from-global-scope="Drawpane.Icon" name="warning"></x-import></span>
          <span>Couldn't export 2 layers. Images over 16,000 px wide.</span>
          <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="ghost">Details</x-import>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">Empty page</figcaption>
      <div style="height: 200px; border-radius: var(--radius-lg); background: var(--canvas); box-shadow: inset 0 0 0 1px var(--line-strong); display: grid; place-items: center; text-align: center">
        <div style="display: grid; gap: 8px; justify-items: center">
          <div style="font-family: var(--font-display); font-size: 26px; line-height: 30px">This page is empty</div>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted)">Press <x-import component-from-global-scope="Drawpane.Kbd">B</x-import> to draw a board, or paste anything</div>
          <div style="display: flex; gap: 8px">
            <x-import component-from-global-scope="Drawpane.Button" size="sm" icon="board">Phone board</x-import>
            <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="ghost" icon="component">Insert component</x-import>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">Loading · skeletons match the final layout</figcaption>
      <div aria-busy="true" style="height: 200px; padding: 16px; box-sizing: border-box; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{skeletons}}" as="s" hint-placeholder-count="3">
          <div style="display: grid; gap: 8px; align-content: start">
            <span style="height: 96px; border-radius: var(--radius-md); background: var(--surface-sunken)"></span>
            <span style="height: 10px; width: 70%; border-radius: 3px; background: var(--surface-active)"></span>
            <span style="height: 10px; width: 45%; border-radius: 3px; background: var(--surface-sunken)"></span>
          </div>
        </sc-for>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">Heavy file · stays fast by loading pages on demand</figcaption>
      <div style="padding: 16px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); display: grid; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 18px">
          <span style="display: inline-flex; color: var(--info)"><x-import component-from-global-scope="Drawpane.Icon" name="layers"></x-import></span>
          <span style="flex: 1"><b style="font-weight: 600">Brand archive</b> has 41 pages and 38,200 layers</span>
        </div>
        <div style="font-size: 12px; line-height: 16px; color: var(--ink-muted)">Pages load when you open them. Searching still covers the whole file.</div>
        <div style="height: 6px; border-radius: 3px; background: var(--surface-sunken)"><div style="width: 34%; height: 6px; border-radius: 3px; background: var(--info)"></div></div>
        <div style="font-size: 11px; line-height: 14px; color: var(--ink-muted)">Loading page 2 of 41 · 1.4 s</div>
      </div>
    </figure>

    <figure style="margin: 0; display: grid; gap: 8px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 600">File not found or no access</figcaption>
      <div style="padding: 20px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-pane); display: grid; gap: 8px">
        <div style="font-size: 15px; line-height: 20px; font-weight: 600">You don't have access to “Q4 roadmap”</div>
        <div style="font-size: 13px; line-height: 18px; color: var(--ink-muted)">Signed in as dev@contractor.io. Ask the owner, or switch account.</div>
        <div style="display: flex; gap: 8px; margin-top: 4px">
          <x-import component-from-global-scope="Drawpane.Button" variant="primary" size="sm">Request access</x-import>
          <x-import component-from-global-scope="Drawpane.Button" size="sm" variant="ghost">Switch account</x-import>
        </div>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', skeletons: [1, 2, 3] };
  }
}
</script>
</body>
</html>
