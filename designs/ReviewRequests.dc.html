<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawpane review requests and protected main</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/drawpane/tokens.css">
<link rel="stylesheet" href="ds/drawpane/components/bundle.css">
<script src="ds/drawpane/components/bundle.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="u-sheet">
  <header class="u-sheethead"><h1 class="u-h1">Reviews and protected main</h1><p class="u-lead">Teams can protect main so every change goes through a branch and a review, the same way for people and agents.</p></header>
  <div class="u-grid">
    <figure class="u-fig" style="width: 400px">
      <figcaption class="u-cap">Request a review · from the branch menu</figcaption>
      <section class="u-modal u-col" style="padding: 16px">
        <strong class="u-lg">Ask for review of feature/greeting</strong>
        <x-import component-from-global-scope="Drawpane.TextField" label="Reviewers" default-value="Lena Park, Dev Patel"></x-import>
        <x-import component-from-global-scope="Drawpane.TextField" label="What to look at" default-value="New greeting copy and the larger title. Ignore the tab bar."></x-import>
        <div class="u-row u-sm"><span class="u-grow u-muted">Changes</span><span>17 · 2 boards</span></div>
        <div class="u-row" style="justify-content: flex-end"><x-import component-from-global-scope="Drawpane.Button">Cancel</x-import><x-import component-from-global-scope="Drawpane.Button" variant="primary">Request review</x-import></div>
      </section>
      <figcaption class="u-cap" style="margin-top: 16px">Main is protected · direct edits are redirected</figcaption>
      <div class="u-toast"><x-import component-from-global-scope="Drawpane.Icon" name="branch"></x-import><span class="u-grow">Main is protected. Your edit started branch <strong>ziyang/quick-fix</strong>.</span><span class="u-tbtn">Open</span></div>
    </figure>
    <figure class="u-fig" style="flex: 1 1 480px; max-width: 560px">
      <figcaption class="u-cap">Your review queue</figcaption>
      <section class="u-pane">
        <div class="u-head"><h2 class="u-h3">Waiting on you · 4</h2><x-import component-from-global-scope="Drawpane.SegmentedControl" label="Filter" value="me" options="{{f}}"></x-import></div>
        <sc-for list="{{q}}" as="r" hint-placeholder-count="5">
          <div class="u-row" style="padding: 10px 14px; border-top: 1px solid var(--line)">
            <span class="{{r.avc}}" style="{{r.avs}}">{{r.ini}}</span>
            <span class="u-grow u-col" style="gap: 0"><span class="u-md u-b">{{r.t}}</span><span class="u-xs u-muted">{{r.d}}</span></span>
            <span class="{{r.cc}}">{{r.c}}</span>
          </div>
        </sc-for>
      </section>
    </figure>
    <figure class="u-fig" style="width: 340px">
      <figcaption class="u-cap">Project rule · Settings · Projects · Mobile</figcaption>
      <section class="u-pane u-col" style="padding: 16px">
        <strong class="u-md">Protect main</strong>
        <x-import component-from-global-scope="Drawpane.Switch" checked="{{H.yes}}" label="Changes to main need a branch"></x-import>
        <div class="u-row u-sm"><span class="u-grow">Approvals needed</span><span class="u-select" style="height: 24px">1 <x-import component-from-global-scope="Drawpane.Icon" name="chevron-down" size="12"></x-import></span></div>
        <div class="u-row u-sm"><span class="u-grow">Who can approve</span><span class="u-select" style="height: 24px">Lena, Ana <x-import component-from-global-scope="Drawpane.Icon" name="chevron-down" size="12"></x-import></span></div>
        <x-import component-from-global-scope="Drawpane.Switch" checked="{{H.yes}}" label="Design-system lint must pass"></x-import>
        <x-import component-from-global-scope="Drawpane.Switch" label="Small text-only fixes skip review"></x-import>
        <span class="u-xs u-muted">Agents follow the same rule. Their merges also need a person.</span>
      </section>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    var T = this.props.theme ?? 'light';
    var H = {
      slot: { AR: 1, LP: 2, SO: 3, Z: 4, MH: 5, DP: 6, KT: 7, JN: 8 },
      p: function (ini, name) { var a = ini === 'AI'; return { ini: ini, name: name || '', cls: 'u-av' + (a ? ' u-av--agent' : ''), st: a ? '' : 'background: var(--presence-' + (H.slot[ini] || 7) + ')' }; },
      sel: function (b) { return b ? 'is-sel' : ''; },
      on: function (b) { return b ? 'is-on' : ''; },
      chip: function (t) { return 'u-chip' + (t ? ' u-chip--' + t : ''); },
      opts: function (a) { return a.map(function (x) { return typeof x === 'string' ? { value: x.toLowerCase(), label: x } : x; }); },
      bg: function (c) { return 'background: ' + c; },
      hide: function (b) { return b ? '' : 'display: none'; },
      yes: true, no: false,
      agentTabs: [{ value: 'agents', label: 'Agents' }, { value: 'runs', label: 'Runs' }, { value: 'usage', label: 'Usage' }, { value: 'connections', label: 'Connections' }, { value: 'models', label: 'Models and limits' }, { value: 'skills', label: 'Skills' }, { value: 'automations', label: 'Automations' }],
      modes: [{ value: 'design', label: 'Design' }, { value: 'agent', label: 'Agent' }, { value: 'inspect', label: 'Inspect' }],
      dmodes: [{ value: 'design', label: 'Design' }, { value: 'prototype', label: 'Prototype' }, { value: 'inspect', label: 'Inspect' }]
    };
    var __v = (function () {
    var Q = [['AR', 'feature/greeting', 'Ana · 17 changes · "New greeting copy"', 'Requested 1 h ago', 'u-chip u-chip--signal'], ['AI', 'agent/a11y-home', 'Accessibility reviewer for Dev · 3 fixes', 'Lint passed', 'u-chip u-chip--agent'], ['SO', 'feature/calendar-week', 'Sam · 42 changes · 1 conflict', 'Conflict', 'u-chip u-chip--signal'], ['MH', 'feature/checkout-v3', 'Mo · 41 changes · approved by Ana', '1 of 1 · can merge', 'u-chip u-chip--ok'], ['AI', 'mcp/settings-page', 'Claude Code for Ziyang · 9 actions', 'Waiting 2 h', 'u-chip u-chip--agent']];
    return {
      f: H.opts([{ value: 'me', label: 'Mine' }, 'Team', 'Agents']),
      q: Q.map(function (r) { var p = H.p(r[0]); return { ini: r[0], avc: p.cls, avs: p.st, t: r[1], d: r[2], c: r[3], cc: r[4] }; })
    };
    }).call(this);
    __v.H = H; if (!__v.theme) __v.theme = T; return __v;
  }
}
</script>
</body>
</html>
