name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    # The render engine (packages/engine, decision 0040): Rust built to WebAssembly. Lints and
    # tests the crate, fuzzes it briefly, builds both modules (failing over their size budgets)
    # and hands them to the other jobs, which need no Rust toolchain.
    name: Render engine (Rust, WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: jdx/mise-action@v2
        with:
          working_directory: packages/engine
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine/rust -> target
      - run: pnpm install --frozen-lockfile
      - name: Format
        working-directory: packages/engine/rust
        run: cargo fmt --check
      - name: Clippy (CPU, with the test kernels)
        working-directory: packages/engine/rust
        run: cargo clippy --locked --all-targets --features test-kernels -- -D warnings
      - name: Clippy (the browser WebGPU build, WebAssembly)
        working-directory: packages/engine/rust
        run: cargo clippy --locked --features gpu --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (the WebGL2 fallback build, WebAssembly)
        working-directory: packages/engine/rust
        run: cargo clippy --locked --features webgl --target wasm32-unknown-unknown -- -D warnings
      - name: Tests, and a short seeded fuzz
        working-directory: packages/engine/rust
        run: cargo test --locked && FUZZ_CASES=300 FUZZ_SEED=random cargo test --locked --test fuzz
      - name: Build all engine modules, held to their size budgets
        run: pnpm --filter @drawpane/engine build
      - name: The Worker build in workerd beside the agent runner's set, under its caps
        run: pnpm --filter @drawpane/engine-workerd test:workerd
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-dist
          path: packages/engine/dist
          retention-days: 7

  check:
    name: Lint, typecheck, test, build
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The engine's modules come from the engine job.
      ENGINE_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: packages/engine/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The installer's release deploys (Wrangler dry run)
        run: pnpm --filter create-drawpane smoke

  e2e:
    # The browser suite against a real Worker (wrangler dev, local D1 and R2),
    # split by spec file: each file brings up its own instance, so shards
    # share nothing. See apps/web/playwright.config.ts.
    name: End to end (${{ matrix.shard }}/4)
    needs: engine
    runs-on: ubuntu-latest
    # The render engine's parity spec draws every Figma suite on the CPU and on SwiftShader.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      WRANGLER_SEND_METRICS: "false"
      ENGINE_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: packages/engine/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Playwright's version, for the browser cache
        id: playwright
        run: echo "version=$(pnpm --filter @drawpane/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @drawpane/web exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @drawpane/web exec playwright install-deps chromium
      - name: Run the shard
        run: pnpm --filter @drawpane/web exec playwright test --project=chromium --shard=${{ matrix.shard }}/4
      - name: Keep the report, traces and screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  deploy:
    name: Deploy to the dogfooding instance
    needs: [engine, check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ENGINE_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: packages/engine/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply D1 migrations
        run: pnpm --filter @drawpane/worker run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the agent runner
        # Before the Worker, which binds it by script name (decision 0033).
        run: pnpm --filter @drawpane/agent-runner run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        # The domain is a secret, not a variable, so it's masked in the public logs.
        run: pnpm --filter @drawpane/worker run deploy -- --domain "$DEPLOY_DOMAIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
