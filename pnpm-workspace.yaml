packages:
  - apps/*
  - packages/*
  - tools/kit-parity
  - tools/render-engine-spike

catalog:
  typescript: 7.0.2
  vitest: 5.1.0
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.8
  "@vitejs/plugin-react": 6.3.0
  zod: 4.6.7
  wrangler: 4.161.0
  fast-check: 4.10.2

allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  # Pulled in by jsPDF (via canvg); its postinstall only prints a banner.
  core-js: false

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261113.1"
  - miniflare@5.20261110.2-beta
  - wrangler@4.161.0
  - "@cloudflare/vitest-plugin@1.8.1"

patchedDependencies:
  "@open-pencil/fig@0.16.0": patches/@open-pencil__fig@0.16.0.patch
  "@open-pencil/scene-graph@0.16.0": patches/@open-pencil__scene-graph@0.16.0.patch
  "@resvg/resvg-wasm@2.6.2": patches/@resvg__resvg-wasm@2.6.2.patch
  harfbuzzjs@1.6.4: patches/harfbuzzjs@1.6.4.patch
